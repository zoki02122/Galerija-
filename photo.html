<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arhiva</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='14' fill='%230d0e10'/%3E%3Cpath d='M50 22 L74 50 L50 78 L26 50 Z' fill='none' stroke='%23c9a355' stroke-width='5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#0d0e10; --surface:#17181b; --ink:#ede9e1; --ink-dim:#8b8d92;
    --brass:#c9a355; --brass-soft:#8a7240; --line:#2a2c30;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  html{-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;
    overflow:hidden;-webkit-font-smoothing:antialiased;
  }
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  .photo{
    position:absolute;inset:0;background-size:contain;background-position:center;background-repeat:no-repeat;
    -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;
  }
  .overlay{
    position:fixed;left:0;right:0;bottom:0;padding:16px 20px calc(18px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, rgba(13,14,16,0.92), rgba(13,14,16,0));
    text-align:center;
  }
  .cap{font-family:'Fraunces',serif;font-style:italic;font-size:16px;margin:0 0 6px;color:var(--ink);}
  .hint{font-size:12.5px;color:var(--ink-dim);max-width:340px;margin:0 auto;line-height:1.6;}
  .hint b{color:var(--brass);font-weight:600;}
  a.back{color:var(--brass);font-family:'Fraunces',serif;font-style:italic;font-size:13.5px;margin-top:10px;
    text-decoration:none;border-bottom:1px solid var(--brass-soft);padding-bottom:2px;display:inline-block;}
  a.back.tiny{position:fixed;bottom:14px;right:16px;font-size:11px;opacity:0.45;margin-top:0;border-bottom:none;}
  .missing{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    font-family:'Fraunces',serif;font-style:italic;color:var(--ink-dim);font-size:15px;text-align:center;padding:20px;}
  .doc-stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center;}
  .doc-icon{width:64px;height:64px;color:var(--brass);}
  .open-btn{
    background:var(--brass);color:#1a1400;border:none;
    padding:12px 22px;font-family:'Fraunces',serif;font-weight:600;font-size:14.5px;cursor:pointer;
  }
  .open-btn:active{opacity:0.85;}
  .pdf-canvas{position:absolute;inset:0;margin:auto;max-width:100%;max-height:100%;display:block;}
  .full-doc-link{position:fixed;bottom:14px;left:16px;font-size:11px;color:var(--ink-dim);opacity:0.6;
    font-family:'Fraunces',serif;font-style:italic;text-decoration:none;border-bottom:1px solid var(--ink-dim);padding-bottom:2px;}
  .doc-reader{position:fixed;inset:0;overflow:auto;background:#f4f1ea;color:#232323;
    padding:20px 18px calc(70px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;}
  .doc-reader-inner{max-width:640px;margin:0 auto;font-family:'Inter',sans-serif;font-size:15px;line-height:1.6;}
  .doc-reader-inner h1,.doc-reader-inner h2,.doc-reader-inner h3{font-family:'Fraunces',serif;color:#1a1400;}
  .doc-reader-inner table{border-collapse:collapse;width:100%;margin:0 0 14px;font-size:13px;}
  .doc-reader-inner td,.doc-reader-inner th{border:1px solid #c9c3b4;padding:6px 8px;text-align:left;}
  .doc-reader-inner img{max-width:100%;height:auto;}
  .doc-reader-bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;
    border-top:1px solid var(--line);}
  .doc-reader-bar .cap{font-size:13px;margin:0;color:var(--ink);text-align:left;flex:1;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;}
  .doc-reader-bar .open-btn{padding:9px 16px;font-size:13px;white-space:nowrap;}
  .sheet-tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px;}
  .sheet-tabs button{flex:none;background:none;border:1px solid #c9c3b4;color:#5b5648;padding:5px 12px;
    font-family:'Inter',sans-serif;font-size:12px;cursor:pointer;border-radius:2px;}
  .sheet-tabs button.active{background:#1a1400;color:var(--brass);border-color:#1a1400;}
</style>
</head>
<body>
<div id="content"><p class="missing">Učitavanje...</p></div>

<script>
const IDB_NAME = 'galerijaDB';
const IDB_STORE = 'items';
function idbGetItem(id){
  return new Promise((resolve)=>{
    try{
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = ()=>{
        const db = req.result;
        if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE, {keyPath:'id'});
      };
      req.onsuccess = ()=>{
        const db = req.result;
        if(!db.objectStoreNames.contains(IDB_STORE)){ resolve(null); return; }
        const tx = db.transaction(IDB_STORE, 'readonly');
        const getReq = tx.objectStore(IDB_STORE).get(id);
        getReq.onsuccess = ()=>resolve(getReq.result || null);
        getReq.onerror = ()=>resolve(null);
      };
      req.onerror = ()=>resolve(null);
    }catch(e){ resolve(null); }
  });
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const params = new URLSearchParams(location.search);
const id = params.get('p');
const content = document.getElementById('content');

(async ()=>{
  const item = id ? await idbGetItem(id) : null;

  if(!item){
    content.innerHTML =
      '<div class="missing"><p style="margin:0;">Stavka nije pronađena u ovom browseru.</p>' +
      '<a class="back" href="index.html">\u2190 Nazad u Arhivu</a></div>';
    return;
  }
  document.title = item.name;

  const mimeMatch = /^data:([^;]+);/.exec(item.dataUrl || '');
  const mime = mimeMatch ? mimeMatch[1] : '';
  const isPdf = item.type === 'pdf' || mime === 'application/pdf';
  const isImage = !isPdf && (item.type === 'image' || (item.type !== 'doc' && mime.indexOf('image/') === 0));

  const backTiny = '<a class="back tiny" href="index.html">Arhiva</a>';

  if(isImage){
    content.innerHTML =
      '<div class="stage"><div class="photo" oncontextmenu="return false;" style="background-image:url(\''+item.dataUrl.replace(/'/g,"%27")+'\')"></div></div>' +
      backTiny;
  }else if(isPdf){
    content.innerHTML = '<div class="stage"><canvas class="pdf-canvas" id="pdfCanvas"></canvas></div>' + backTiny;
    const openFullDoc = async ()=>{
      try{
        const res = await fetch(item.dataUrl);
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = (item.name || 'dokument') + '.pdf';
        document.body.appendChild(a);
        a.click();
        a.remove();
      }catch(e){}
    };
    try{
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const base64 = item.dataUrl.split(',')[1];
      const raw = atob(base64);
      const bytes = new Uint8Array(raw.length);
      for(let i=0;i<raw.length;i++){ bytes[i] = raw.charCodeAt(i); }
      const pdf = await pdfjsLib.getDocument({data: bytes}).promise;
      const page = await pdf.getPage(1);
      const canvas = document.getElementById('pdfCanvas');
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const baseViewport = page.getViewport({scale: 1});
      const scale = Math.min(
        (window.innerWidth * dpr) / baseViewport.width,
        (window.innerHeight * dpr) / baseViewport.height
      );
      const viewport = page.getViewport({scale});
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      canvas.style.width = (viewport.width / dpr) + 'px';
      canvas.style.height = (viewport.height / dpr) + 'px';
      await page.render({canvasContext: ctx, viewport}).promise;
      if(pdf.numPages > 1){
        const link = document.createElement('a');
        link.className = 'full-doc-link';
        link.textContent = 'Otvori ceo dokument (' + pdf.numPages + ' str.)';
        link.href = '#';
        link.onclick = (e)=>{ e.preventDefault(); openFullDoc(); };
        document.body.appendChild(link);
      }
    }catch(e){
      console.error(e);
      content.innerHTML =
        '<div class="doc-stage">' +
          '<svg class="doc-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>' +
          '<div class="cap">'+escapeHtml(item.name)+' <span style="color:var(--ink-dim);font-family:\'IBM Plex Mono\',monospace;font-style:normal;font-size:11px;">(PDF)</span></div>' +
          '<button class="open-btn" id="openDoc">Otvori</button>' +
        '</div>' + backTiny;
      document.getElementById('openDoc').onclick = openFullDoc;
    }
  }else{
    const label = item.ext || 'FAJL';
    const extLower = (item.ext || '').toLowerCase();
    const fileName = (item.name || 'dokument') + (item.ext ? '.'+extLower : '');
    const isDocx = extLower === 'docx';
    const isXlsx = extLower === 'xlsx' || extLower === 'xls';

    const downloadFile = async ()=>{
      try{
        const res = await fetch(item.dataUrl);
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        a.remove();
      }catch(e){}
    };

    const showFallback = ()=>{
      content.innerHTML =
        '<div class="doc-stage">' +
          '<svg class="doc-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>' +
          '<div class="cap">'+escapeHtml(item.name)+' <span style="color:var(--ink-dim);font-family:\'IBM Plex Mono\',monospace;font-style:normal;font-size:11px;">('+label+')</span></div>' +
          '<button class="open-btn" id="openDoc">Otvori</button>' +
        '</div>' + backTiny;
      document.getElementById('openDoc').onclick = downloadFile;
    };

    if(isDocx && typeof mammoth !== 'undefined'){
      try{
        const base64 = item.dataUrl.split(',')[1];
        const raw = atob(base64);
        const bytes = new Uint8Array(raw.length);
        for(let i=0;i<raw.length;i++){ bytes[i] = raw.charCodeAt(i); }
        const result = await mammoth.convertToHtml({arrayBuffer: bytes.buffer});
        content.innerHTML =
          '<div class="doc-reader"><div class="doc-reader-inner">'+result.value+'</div></div>' +
          '<div class="doc-reader-bar"><p class="cap">'+escapeHtml(item.name)+'</p><button class="open-btn" id="openDoc">Preuzmi</button></div>';
        document.getElementById('openDoc').onclick = downloadFile;
      }catch(e){
        console.error(e);
        showFallback();
      }
    }else if(isXlsx && typeof XLSX !== 'undefined'){
      try{
        const base64 = item.dataUrl.split(',')[1];
        const wb = XLSX.read(base64, {type:'base64'});
        let activeSheet = wb.SheetNames[0];
        const renderSheet = (name)=>{
          const html = XLSX.utils.sheet_to_html(wb.Sheets[name], {editable:false});
          const tabsHtml = wb.SheetNames.length > 1
            ? '<div class="sheet-tabs">' + wb.SheetNames.map(n=>
                '<button data-sheet="'+escapeHtml(n)+'" class="'+(n===name?'active':'')+'">'+escapeHtml(n)+'</button>'
              ).join('') + '</div>'
            : '';
          content.innerHTML =
            '<div class="doc-reader"><div class="doc-reader-inner">'+tabsHtml+html+'</div></div>' +
            '<div class="doc-reader-bar"><p class="cap">'+escapeHtml(item.name)+'</p><button class="open-btn" id="openDoc">Preuzmi</button></div>';
          document.getElementById('openDoc').onclick = downloadFile;
          content.querySelectorAll('.sheet-tabs button').forEach(btn=>{
            btn.onclick = ()=>renderSheet(btn.getAttribute('data-sheet'));
          });
        };
        renderSheet(activeSheet);
      }catch(e){
        console.error(e);
        showFallback();
      }
    }else{
      showFallback();
    }
  }
})();
</script>
</body>
</html>
