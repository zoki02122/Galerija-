<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arhiva</title>
<script>
  var __n = new URLSearchParams(location.search).get('n');
  if(__n) document.title = __n;
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='14' fill='%230d0e10'/%3E%3Cpath d='M50 22 L74 50 L50 78 L26 50 Z' fill='none' stroke='%23c9a355' stroke-width='5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0e10; --surface:#17181b; --ink:#ede9e1; --ink-dim:#8b8d92;
    --brass:#c9a355; --brass-soft:#8a7240; --line:#2a2c30;
  }
  *{box-sizing:border-box;}
  html{-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:28px 20px;text-align:center;-webkit-font-smoothing:antialiased;
  }
  .frame{border:1px solid var(--brass-soft);padding:6px;background:var(--surface);max-width:100%;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}
  .frame .photo{max-width:100%;max-height:58vh;display:block;background-size:contain;background-position:center;background-repeat:no-repeat;min-width:200px;min-height:200px;}
  .cap{font-family:'Fraunces',serif;font-style:italic;font-size:17px;margin:18px 0 4px;color:var(--ink);}
  .hint{font-size:13px;color:var(--ink-dim);max-width:340px;line-height:1.65;margin-top:20px;}
  .hint b{color:var(--brass);font-weight:600;}
  a.back{color:var(--brass);font-family:'Fraunces',serif;font-style:italic;font-size:14px;margin-top:26px;
    text-decoration:none;border-bottom:1px solid var(--brass-soft);padding-bottom:2px;display:inline-block;}
  .missing{font-family:'Fraunces',serif;font-style:italic;color:var(--ink-dim);font-size:15px;}
  .doc-icon{width:64px;height:64px;color:var(--brass);}
  .open-btn{
    margin-top:18px;background:var(--brass);color:#1a1400;border:none;
    padding:12px 22px;font-family:'Fraunces',serif;font-weight:600;font-size:14.5px;cursor:pointer;
  }
  .open-btn:active{opacity:0.85;}
</style>
</head>
<body>
<div id="content"><p class="missing">Učitavanje...</p></div>

<script>
const IDB_NAME = 'galerijaDB';
const IDB_STORE = 'items';
function idbGetItem(id){
  return new Promise((resolve)=>{
    try{
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = ()=>{
        const db = req.result;
        if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE, {keyPath:'id'});
      };
      req.onsuccess = ()=>{
        const db = req.result;
        if(!db.objectStoreNames.contains(IDB_STORE)){ resolve(null); return; }
        const tx = db.transaction(IDB_STORE, 'readonly');
        const getReq = tx.objectStore(IDB_STORE).get(id);
        getReq.onsuccess = ()=>resolve(getReq.result || null);
        getReq.onerror = ()=>resolve(null);
      };
      req.onerror = ()=>resolve(null);
    }catch(e){ resolve(null); }
  });
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const params = new URLSearchParams(location.search);
const id = params.get('p');
const content = document.getElementById('content');

(async ()=>{
  const item = id ? await idbGetItem(id) : null;

  if(!item){
    content.innerHTML =
      '<p class="missing">Stavka nije pronađena u ovom browseru.</p>' +
      '<a class="back" href="index.html">\u2190 Nazad u Arhivu</a>';
    return;
  }
  document.title = item.name;
  const mimeMatch = /^data:([^;]+);/.exec(item.dataUrl || '');
  const mime = mimeMatch ? mimeMatch[1] : '';
  const isImage = item.type === 'image' || (item.type !== 'pdf' && item.type !== 'doc' && mime.indexOf('image/') === 0);
  if(isImage){
    content.innerHTML =
      '<div class="frame"><div class="photo" oncontextmenu="return false;" style="width:min(84vw,420px);height:58vh;background-image:url(\''+item.dataUrl.replace(/'/g,"%27")+'\')"></div></div>' +
      '<div class="cap">'+escapeHtml(item.name)+'</div>' +
      '<div class="hint">Da zakačiš ovu sliku na početni ekran: dodirni meni (tri tačke) u Chrome traci, pa <b>"Dodaj na početni ekran"</b>. (Ne dodiruj sliku iznad — samo meni gore desno.)</div>' +
      '<a class="back" href="index.html">\u2190 Nazad u Arhivu</a>';
  }else{
    const label = item.type === 'pdf' ? 'PDF' : (item.ext || 'FAJL');
    content.innerHTML =
      '<svg class="doc-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>' +
      '<div class="cap">'+escapeHtml(item.name)+' <span style="color:var(--ink-dim);font-family:\'IBM Plex Mono\',monospace;font-style:normal;font-size:11px;">('+label+')</span></div>' +
      '<button class="open-btn" id="openDoc">Otvori</button>' +
      '<div class="hint">Da zakačiš ovu stavku na početni ekran: dodirni meni (tri tačke) u Chrome traci, pa <b>"Dodaj na početni ekran"</b>.</div>' +
      '<a class="back" href="index.html">\u2190 Nazad u Arhivu</a>';
    document.getElementById('openDoc').onclick = async ()=>{
      try{
        const res = await fetch(item.dataUrl);
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        window.open(url, '_blank');
      }catch(e){}
    };
  }
})();
</script>
</body>
</html>
