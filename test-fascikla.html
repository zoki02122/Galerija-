<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proba: upis u fasciklu</title>
<style>
  :root{ --bg:#F6F5F1; --ink:#1b1b1e; --dim:#6b6b70; --ok:#1f7a45; --bad:#b3261e; --line:#dcd8cc; --acc:#0E2747; }
  body{ margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui, sans-serif; padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); }
  h1{ font-size:20px; margin:0 0 4px; }
  .sub{ color:var(--dim); font-size:13px; margin-bottom:16px; }
  .row{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; }
  .row b{ display:block; font-size:13px; color:var(--dim); font-weight:600; margin-bottom:3px; }
  .ok{ color:var(--ok); font-weight:700; } .bad{ color:var(--bad); font-weight:700; }
  button{ width:100%; height:52px; border-radius:12px; border:none; background:var(--acc); color:#fff; font-size:16px; font-weight:700; margin:6px 0; }
  button.sec{ background:#fff; color:var(--acc); border:1.5px solid var(--acc); }
  #log{ font-size:13px; color:var(--dim); white-space:pre-wrap; margin-top:12px; }
</style>
</head>
<body>
<h1>Proba: upis u fasciklu</h1>
<div class="sub">Samo proba. Ne dira podatke Arhive.</div>

<div class="row"><b>1. Da li Chrome ima izbor fascikle</b><span id="sup">…</span></div>
<div class="row"><b>2. Izabrana fascikla</b><span id="folder">nije izabrana</span></div>
<div class="row"><b>3. Dozvola posle ponovnog otvaranja</b><span id="perm">…</span></div>
<div class="row"><b>4. Automatski upis pri otvaranju (bez dodira)</b><span id="auto">…</span></div>

<button id="pick">Izaberi fasciklu i upiši probni fajl</button>
<button class="sec" id="again">Upiši ponovo (sa dodirom)</button>
<div id="log"></div>

<script>
const $ = id => document.getElementById(id);
const log = m => { $('log').textContent += new Date().toLocaleTimeString('sr-RS') + '  ' + m + '\n'; };
const DB = 'proba-fascikla', ST = 'h';
function db(){ return new Promise((res, rej)=>{ const r = indexedDB.open(DB, 1); r.onupgradeneeded = ()=>r.result.createObjectStore(ST); r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error); }); }
async function saveHandle(h){ const d = await db(); return new Promise((res, rej)=>{ const t = d.transaction(ST, 'readwrite'); t.objectStore(ST).put(h, 'dir'); t.oncomplete = res; t.onerror = ()=>rej(t.error); }); }
async function loadHandle(){ const d = await db(); return new Promise((res, rej)=>{ const q = d.transaction(ST).objectStore(ST).get('dir'); q.onsuccess = ()=>res(q.result || null); q.onerror = ()=>rej(q.error); }); }
async function writeTest(dir, how){
  const name = 'arhiva-proba.json';
  const fh = await dir.getFileHandle(name, { create:true });
  const w = await fh.createWritable();
  await w.write(JSON.stringify({ proba:true, nacin:how, vreme:new Date().toISOString() }, null, 2));
  await w.close();
  return name;
}
const supported = 'showDirectoryPicker' in window;
$('sup').innerHTML = supported ? '<span class="ok">DA</span>' : '<span class="bad">NE — ovaj Chrome ne podržava izbor fascikle</span>';
if(!supported){ $('perm').textContent = '—'; $('auto').textContent = '—'; $('pick').disabled = true; $('again').disabled = true; }

(async ()=>{
  if(!supported) return;
  let dir = null;
  try{ dir = await loadHandle(); }catch(e){ log('Čitanje sačuvane fascikle: ' + e.message); }
  if(!dir){ $('perm').textContent = 'još nije izabrana fascikla'; $('auto').textContent = 'još nije izabrana fascikla'; return; }
  $('folder').textContent = dir.name;
  let state = 'nepoznato';
  try{ state = await dir.queryPermission({ mode:'readwrite' }); }catch(e){ state = 'greška: ' + e.message; }
  $('perm').innerHTML = state === 'granted' ? '<span class="ok">ZADRŽANA (granted)</span>' : '<span class="bad">NIJE zadržana (' + state + ')</span>';
  if(state === 'granted'){
    try{ const n = await writeTest(dir, 'automatski'); $('auto').innerHTML = '<span class="ok">RADI — upisan ' + n + '</span>'; }
    catch(e){ $('auto').innerHTML = '<span class="bad">NE — ' + e.name + ': ' + e.message + '</span>'; }
  }else{
    $('auto').innerHTML = '<span class="bad">NE — traži ponovnu dozvolu</span>';
  }
})();

$('pick').onclick = async ()=>{
  try{
    const dir = await window.showDirectoryPicker({ mode:'readwrite', id:'arhiva-backup' });
    await saveHandle(dir);
    $('folder').textContent = dir.name;
    const n = await writeTest(dir, 'izbor');
    log('Upisan ' + n + ' u „' + dir.name + '“.');
  }catch(e){ log('Izbor/upis: ' + e.name + ': ' + e.message); }
};
$('again').onclick = async ()=>{
  try{
    const dir = await loadHandle();
    if(!dir){ log('Prvo izaberite fasciklu.'); return; }
    const p = await dir.requestPermission({ mode:'readwrite' });
    if(p !== 'granted'){ log('Dozvola: ' + p); return; }
    const n = await writeTest(dir, 'dodir');
    log('Upisan ' + n + ' (sa dodirom).');
  }catch(e){ log('Ponovni upis: ' + e.name + ': ' + e.message); }
};
</script>
</body>
</html>
