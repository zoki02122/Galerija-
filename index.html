<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galerija</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%2314151a'/%3E%3Ccircle cx='40' cy='40' r='18' fill='none' stroke='%23e8a33d' stroke-width='8'/%3E%3Cline x1='53' y1='53' x2='75' y2='75' stroke='%23e8a33d' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14151a;
    --panel:#1c1e24;
    --panel-2:#23262d;
    --text:#edede7;
    --text-dim:#9296a0;
    --accent:#e8a33d;
    --border:#2e313a;
    --danger:#c9584f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:20px 16px 60px;
  }
  .wrap{max-width:920px;margin:0 auto;}
  header{margin-bottom:22px;}
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:26px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    margin:0 0 4px;
  }
  .sub{color:var(--text-dim);font-size:13px;margin:0;}

  .searchbar{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 14px;
    margin-top:18px;
    transition:border-color .15s;
  }
  .searchbar:focus-within{border-color:var(--accent);}
  .searchbar svg{flex:none;stroke:var(--text-dim);transition:stroke .15s;}
  .searchbar:focus-within svg{stroke:var(--accent);}
  .searchbar input{
    flex:1;
    background:none;
    border:none;
    outline:none;
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:15px;
  }
  .searchbar input::placeholder{color:var(--text-dim);}

  .toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:18px 0 16px;
  }
  .count{font-size:12px;color:var(--text-dim);font-family:'Space Grotesk',sans-serif;letter-spacing:0.5px;}
  .add-btn{
    background:var(--accent);
    color:#1a1400;
    border:none;
    border-radius:8px;
    padding:9px 16px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:0.3px;
    text-transform:uppercase;
    cursor:pointer;
  }
  .add-btn:active{transform:translateY(1px);}
  input[type=file]{display:none;}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
    gap:14px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    position:relative;
    cursor:pointer;
  }
  .thumb-box{
    aspect-ratio:1/1;
    background:var(--panel-2);
    overflow:hidden;
  }
  .thumb-box img{width:100%;height:100%;object-fit:cover;display:block;}
  .tag{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
    padding:8px 10px;
    border-top:1px dashed var(--border);
  }
  .tag .num{
    font-family:'Space Grotesk',sans-serif;
    font-size:10px;
    color:var(--accent);
    flex:none;
  }
  .tag .name{
    font-size:12.5px;
    color:var(--text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    flex:1;
  }
  .tag input{
    background:none;
    border:none;
    border-bottom:1px solid var(--accent);
    outline:none;
    color:var(--text);
    font-size:12.5px;
    font-family:'Inter',sans-serif;
    width:100%;
  }
  .del-btn{
    position:absolute;
    top:6px;
    right:6px;
    width:22px;
    height:22px;
    border-radius:50%;
    background:rgba(20,21,26,0.75);
    border:1px solid var(--border);
    color:var(--text-dim);
    font-size:13px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .del-btn:hover{color:var(--danger);border-color:var(--danger);}

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--text-dim);
    border:1px dashed var(--border);
    border-radius:10px;
    font-size:14px;
  }
  .empty b{color:var(--text);}

  .modal-bg{
    display:none;
    position:fixed;inset:0;
    background:rgba(10,10,12,0.88);
    z-index:50;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .modal-bg.open{display:flex;}
  .modal-bg img{max-width:100%;max-height:78vh;border-radius:8px;display:block;margin:0 auto;}
  .modal-caption{
    text-align:center;
    color:var(--text-dim);
    font-size:13px;
    margin-top:12px;
  }
  .modal-close{
    position:absolute;
    top:18px;right:18px;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    width:34px;height:34px;
    border-radius:50%;
    cursor:pointer;
    font-size:16px;
  }
  .toast{
    position:fixed;
    bottom:18px;left:50%;
    transform:translateX(-50%);
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 16px;
    border-radius:8px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s;
    z-index:60;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Galerija</h1>
    <p class="sub">Sačuvaj slike, dodeli im naziv, pronađi ih pretragom.</p>
    <div class="searchbar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.2" y2="16.2"></line>
      </svg>
      <input id="search" type="text" placeholder="Pretraži po nazivu...">
    </div>
  </header>

  <div class="toolbar">
    <span class="count" id="count">0 stavki</span>
    <label class="add-btn" for="fileInput">+ Dodaj sliku</label>
    <input id="fileInput" type="file" accept="image/*" multiple>
  </div>

  <div id="gridArea"></div>
</div>

<div class="modal-bg" id="modalBg">
  <button class="modal-close" id="modalClose">✕</button>
  <div>
    <img id="modalImg" src="">
    <div class="modal-caption" id="modalCaption"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let items = []; // {id, name, dataUrl, ts}

const gridArea = document.getElementById('gridArea');
const countEl = document.getElementById('count');
const searchEl = document.getElementById('search');
const fileInput = document.getElementById('fileInput');
const modalBg = document.getElementById('modalBg');
const modalImg = document.getElementById('modalImg');
const modalCaption = document.getElementById('modalCaption');
const toastEl = document.getElementById('toast');

function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(()=>toastEl.classList.remove('show'), 2200);
}

function pad(n){ return String(n).padStart(3,'0'); }

const LS_PREFIX = 'galerija:';

function loadAll(){
  try{
    const raw = localStorage.getItem(LS_PREFIX+'item-ids');
    const ids = raw ? JSON.parse(raw) : [];
    const loaded = [];
    for(const id of ids){
      const raw2 = localStorage.getItem(LS_PREFIX+'item:'+id);
      if(raw2) loaded.push(JSON.parse(raw2));
    }
    loaded.sort((a,b)=>a.ts-b.ts);
    items = loaded;
  }catch(e){
    console.error(e);
    toast('Greška pri učitavanju.');
    items = [];
  }
  render();
}

function saveIndex(){
  const ids = items.map(i=>i.id);
  localStorage.setItem(LS_PREFIX+'item-ids', JSON.stringify(ids));
}

function render(){
  const q = searchEl.value.trim().toLowerCase();
  const filtered = q ? items.filter(i=>i.name.toLowerCase().includes(q)) : items;
  countEl.textContent = items.length + (items.length===1 ? ' stavka' : ' stavki') + (q ? ' · ' + filtered.length + ' prikazano' : '');

  if(items.length === 0){
    gridArea.innerHTML = '<div class="empty"><b>Još nema slika.</b><br>Dodaj prvu sliku dugmetom iznad.</div>';
    return;
  }
  if(filtered.length === 0){
    gridArea.innerHTML = '<div class="empty">Nema rezultata za "'+escapeHtml(searchEl.value)+'".</div>';
    return;
  }

  gridArea.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'grid';
  filtered.forEach((item, i)=>{
    const card = document.createElement('div');
    card.className = 'card';

    const thumbBox = document.createElement('div');
    thumbBox.className = 'thumb-box';
    const img = document.createElement('img');
    img.src = item.dataUrl;
    img.loading = 'lazy';
    thumbBox.appendChild(img);
    thumbBox.onclick = ()=>openModal(item);
    card.appendChild(thumbBox);

    const tag = document.createElement('div');
    tag.className = 'tag';
    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = '#' + pad(i+1);
    const nameSpan = document.createElement('span');
    nameSpan.className = 'name';
    nameSpan.textContent = item.name;
    nameSpan.title = 'Klikni da preimenuješ';
    nameSpan.onclick = (e)=>{ e.stopPropagation(); startRename(item, nameSpan, tag, num); };
    tag.appendChild(num);
    tag.appendChild(nameSpan);
    card.appendChild(tag);

    const del = document.createElement('button');
    del.className = 'del-btn';
    del.textContent = '✕';
    del.title = 'Obriši';
    del.onclick = (e)=>{ e.stopPropagation(); deleteItem(item.id); };
    card.appendChild(del);

    grid.appendChild(card);
  });
  gridArea.appendChild(grid);
}

function startRename(item, nameSpan, tag, num){
  const input = document.createElement('input');
  input.value = item.name;
  tag.replaceChild(input, nameSpan);
  input.focus();
  input.select();
  const commit = ()=>{
    const newName = input.value.trim() || item.name;
    item.name = newName;
    try{
      localStorage.setItem(LS_PREFIX+'item:'+item.id, JSON.stringify(item));
    }catch(e){ toast('Greška pri čuvanju naziva.'); }
    render();
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter') input.blur();
    if(e.key === 'Escape'){ input.value = item.name; input.blur(); }
  });
}

function deleteItem(id){
  if(!confirm('Obrisati ovu sliku?')) return;
  items = items.filter(i=>i.id !== id);
  try{
    localStorage.removeItem(LS_PREFIX+'item:'+id);
    saveIndex();
    toast('Slika obrisana.');
  }catch(e){
    toast('Greška pri brisanju.');
  }
  render();
}

function openModal(item){
  modalImg.src = item.dataUrl;
  modalCaption.textContent = item.name;
  modalBg.classList.add('open');
}
document.getElementById('modalClose').onclick = ()=>modalBg.classList.remove('open');
modalBg.onclick = (e)=>{ if(e.target === modalBg) modalBg.classList.remove('open'); };

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

fileInput.addEventListener('change', async (e)=>{
  const files = Array.from(e.target.files || []);
  fileInput.value = '';
  for(const file of files){
    await addFile(file);
  }
});

function readFileAsDataUrl(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

async function addFile(file){
  try{
    const dataUrl = await readFileAsDataUrl(file);
    const id = 'i' + Date.now() + Math.random().toString(36).slice(2,8);
    const baseName = file.name.replace(/\.[^.]+$/, '');
    const item = { id, name: baseName || 'Slika', dataUrl, ts: Date.now() };
    localStorage.setItem(LS_PREFIX+'item:'+id, JSON.stringify(item));
    items.push(item);
    saveIndex();
    render();
  }catch(e){
    console.error(e);
    if(e && e.name === 'QuotaExceededError'){
      toast('Nema više prostora za nove slike u browseru.');
    }else{
      toast('Greška pri dodavanju slike.');
    }
  }
}

searchEl.addEventListener('input', render);

loadAll();
</script>
</body>
</html>
