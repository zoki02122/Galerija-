<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arhiva</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='14' fill='%230d0e10'/%3E%3Cpath d='M50 22 L74 50 L50 78 L26 50 Z' fill='none' stroke='%23c9a355' stroke-width='5'/%3E%3C/svg%3E">
<!-- manifest namerno uklonjen: Chrome je povremeno sam preuzimao pojedinačne prečice kao deo instalirane aplikacije -->
<meta name="theme-color" content="#0d0e10">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0e10;
    --surface:#17181b;
    --surface-2:#1f2124;
    --line:#2a2c30;
    --line-soft:#232529;
    --ink:#ede9e1;
    --ink-dim:#8b8d92;
    --ink-faint:#5c5e63;
    --brass:#c9a355;
    --brass-soft:#8a7240;
    --brass-glow:rgba(201,163,85,0.22);
    --danger:#b5544a;
  }
  *{box-sizing:border-box;}
  html{-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(201,163,85,0.06), transparent 60%),
      radial-gradient(ellipse 800px 600px at 100% 100%, rgba(255,255,255,0.02), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:28px 18px 70px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:900px;margin:0 auto;}

  header{margin-bottom:26px;}
  .mark-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .mark-title{display:flex;align-items:center;gap:10px;}
  .mark{width:15px;height:15px;border:2px solid var(--brass);transform:rotate(45deg);flex:none;}
  h1{
    font-family:'Fraunces',serif;font-weight:600;font-size:24px;
    letter-spacing:2px;text-transform:uppercase;margin:0;color:var(--ink);
  }
  .sub{color:var(--ink-dim);font-size:13.5px;margin:2px 0 0 25px;font-style:italic;font-family:'Fraunces',serif;}

  .crumb{display:none;align-items:center;gap:10px;margin-top:18px;}
  .crumb.show{display:flex;}
  .crumb .here{font-family:'Fraunces',serif;font-style:italic;color:var(--ink);font-size:21px;}

  .back-btn{
    width:42px;height:42px;border-radius:50%;flex:none;
    border:1px solid var(--line);background:var(--surface);color:var(--ink);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:border-color .2s, color .2s;
  }
  .back-btn:hover, .back-btn:active{border-color:var(--brass-soft);color:var(--brass);}
  .sheet-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .sheet-head h3{margin:0;}

  /* ---------- Selection header ---------- */
  .sel-header{
    display:none;
    align-items:center;
    justify-content:space-between;
    margin-top:18px;
  }
  .sel-header.show{display:flex;}
  .sel-header button{
    background:none;border:none;cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .sel-header .cancel{
    color:var(--ink);font-size:19px;line-height:1;
    width:30px;height:30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line);
  }
  .sel-header .count{
    font-family:'Fraunces',serif;font-style:italic;font-size:15px;color:var(--ink);
  }
  .sel-header .all{color:var(--brass);font-size:13px;letter-spacing:0.3px;}

  /* ---------- Bottom action bar ---------- */
  .sel-bar{
    display:none;
    position:fixed;bottom:0;left:0;right:0;
    background:var(--surface);
    border-top:1px solid var(--brass-soft);
    padding:12px 10px calc(12px + env(safe-area-inset-bottom));
    justify-content:space-around;
    z-index:40;
  }
  .sel-bar.show{display:flex;}
  .sel-bar button{
    background:none;border:none;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:5px;
    color:var(--ink-dim);
    font-family:'Inter',sans-serif;font-size:11px;
    padding:4px 10px;
  }
  .sel-bar button svg{stroke:var(--ink-dim);}
  .sel-bar button.danger{color:var(--danger);}
  .sel-bar button.danger svg{stroke:var(--danger);}
  .sel-bar button:active{opacity:0.6;}
  .sel-bar button[hidden]{display:none;}


  .searchbar{
    display:flex;align-items:center;gap:10px;
    background:var(--surface);border:1px solid var(--line);border-radius:4px;
    padding:12px 14px;margin-top:16px;
    transition:border-color .2s, box-shadow .2s;
  }
  .searchbar:focus-within{border-color:var(--brass-soft);box-shadow:0 0 0 3px var(--brass-glow);}
  .searchbar svg{flex:none;stroke:var(--ink-faint);transition:stroke .2s;}
  .searchbar:focus-within svg{stroke:var(--brass);}
  .searchbar input{flex:1;background:none;border:none;outline:none;color:var(--ink);font-family:'Inter',sans-serif;font-size:15px;}
  .searchbar input::placeholder{color:var(--ink-faint);}

  .toolbar{
    display:flex;justify-content:space-between;align-items:center;
    margin:22px 0 20px;padding-bottom:14px;border-bottom:1px solid var(--line-soft);
  }
  .count{font-family:'IBM Plex Mono',monospace;font-size:15px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-dim);}
  .count b{color:var(--ink);font-weight:600;font-size:17px;}
  .add-btn{display:flex;align-items:center;gap:9px;background:none;border:none;cursor:pointer;padding:2px;font-family:inherit;}
  .add-btn .seal{
    width:34px;height:34px;border-radius:50%;border:1.5px solid var(--brass);
    display:flex;align-items:center;justify-content:center;color:var(--brass);
    transition:background .2s, box-shadow .2s, transform .15s;flex:none;
  }
  .add-btn:active .seal{transform:scale(0.93);}
  .add-btn .seal:hover, .add-btn:focus-visible .seal{background:var(--brass-glow);box-shadow:0 0 0 4px var(--brass-glow);}
  .add-btn .label{font-family:'Fraunces',serif;font-style:italic;font-size:14.5px;color:var(--ink-dim);}
  input[type=file]{display:none;}

  .toolbar-actions{display:flex;align-items:center;gap:14px;}
  .icon-btn{
    width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--ink-dim);
    cursor:pointer;background:none;flex:none;
    transition:border-color .2s, color .2s;
  }
  .icon-btn:active{transform:scale(0.93);}
  .icon-btn:hover, .icon-btn:focus-visible{border-color:var(--brass-soft);color:var(--brass);}

  .section-label{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--ink-faint);margin:0 0 12px;
  }
  .date-label{
    font-family:'Fraunces',serif;font-style:italic;font-size:14px;color:var(--ink-dim);
    margin:26px 0 12px;
  }
  .date-label:first-child{margin-top:0;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:18px 14px;}
  .grid + .section-label{margin-top:30px;}
  .grid.folders-grid{grid-template-columns:repeat(3,1fr);gap:10px 8px;}
  .grid.photos-grid{grid-template-columns:repeat(3,1fr);gap:10px 8px;}
  .photos-grid .meta .name{font-size:13px;}
  .photos-grid .meta .index{font-size:9px;}
  .photos-grid .pdf-thumb svg{width:22px;height:22px;}
  .photos-grid .pdf-thumb .pdf-label{font-size:8.5px;}
  .folders-grid .folder-tile .fname{font-size:12.5px;}
  .folders-grid .folder-tile .fcount{font-size:10.5px;}

  .folder-tile-wide{
    width:100%;display:flex;align-items:center;gap:14px;box-sizing:border-box;
    background:var(--surface);border:1px solid var(--line);
    padding:16px 18px;cursor:pointer;margin-bottom:16px;position:relative;transition:border-color .2s;
  }
  .folder-tile-wide:active{border-color:var(--brass-soft);}
  .folder-tile-wide .fw-icon{
    width:46px;height:46px;flex-shrink:0;border-radius:50%;
    background:var(--surface-2);display:flex;align-items:center;justify-content:center;
  }
  .folder-tile-wide .fw-icon svg{stroke:var(--brass);}
  .folder-tile-wide .fw-text{display:flex;flex-direction:column;min-width:0;}
  .folder-tile-wide .fw-name{
    font-family:'Fraunces',serif;font-style:italic;font-size:16px;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .folder-tile-wide .fw-count{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-faint);margin-top:3px;
  }

  .folder-tile{
    display:flex;flex-direction:column;gap:6px;min-width:0;
    cursor:pointer;position:relative;
  }
  .folder-tile .ftile-cover{
    aspect-ratio:1/1;background:var(--surface);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    position:relative;transition:border-color .2s;
  }
  .folder-tile:active .ftile-cover{border-color:var(--brass-soft);}
  .folder-tile svg{stroke:var(--brass);}
  .folder-tile .ftile-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .folder-tile .fname{
    display:block;font-family:'Fraunces',serif;font-style:italic;font-size:13.5px;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
    height:17px;line-height:17px;
  }
  .folder-tile .fcount{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-faint);height:13px;line-height:13px;}
  .pin-mark{
    position:absolute;top:6px;right:6px;width:18px;height:18px;border-radius:50%;
    background:var(--brass);display:flex;align-items:center;justify-content:center;z-index:2;
  }
  .pin-mark svg{stroke:#1a1400;}

  .card{position:relative;cursor:pointer;}
  .thumb-box{
    position:relative;aspect-ratio:1/1;background:var(--surface-2);
    border:1px solid var(--line);overflow:hidden;transition:border-color .2s;
    -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;
  }
  .card:active .thumb-box{border-color:var(--brass-soft);}
  .thumb-box img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb-box.pdf-thumb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--brass);}
  .thumb-box.pdf-thumb .pdf-label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1.5px;}

  .corner{
    position:absolute;top:0;left:0;width:0;height:0;
    border-style:solid;border-width:16px 16px 0 0;
    border-color:var(--brass) transparent transparent transparent;
    opacity:0.88;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.4));
  }

  .select-mark{
    position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;
    background:rgba(13,14,16,0.82);border:1.5px solid var(--brass-soft);
    display:none;align-items:center;justify-content:center;
    transition:background .15s, border-color .15s;
  }
  .card.selectable .select-mark{display:flex;}
  .card.selected .select-mark{background:var(--brass);border-color:var(--brass);}
  .select-mark svg{opacity:0;stroke:#1a1400;stroke-width:3;}
  .card.selected .select-mark svg{opacity:1;}
  .card.selected .thumb-box{border-color:var(--brass);}

  .meta{padding:8px 1px 0;}
  .meta .index{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1px;color:var(--brass-soft);margin-bottom:2px;}
  .meta .name{display:block;font-family:'Fraunces',serif;font-style:italic;font-size:16.5px;color:var(--ink);white-space:normal;overflow-wrap:break-word;line-height:1.3;}
  .meta input{background:none;border:none;border-bottom:1px solid var(--brass);outline:none;color:var(--ink);font-size:16.5px;font-family:'Fraunces',serif;font-style:italic;width:100%;padding:0;}

  .empty{text-align:center;padding:56px 20px;color:var(--ink-dim);border:1px solid var(--line-soft);position:relative;}
  .empty::before{content:'';position:absolute;inset:8px;border:1px dashed var(--line);pointer-events:none;}
  .empty .mark{margin:0 auto 14px;}
  .empty b{display:block;color:var(--ink);font-family:'Fraunces',serif;font-style:italic;font-size:16px;font-weight:500;margin-bottom:6px;}
  .empty span{font-size:13px;}

  .modal-bg{display:none;position:fixed;inset:0;background:rgba(6,6,7,0.92);z-index:50;align-items:center;justify-content:center;padding:24px;}
  .modal-bg.open{display:flex;}
  .modal-frame{border:1px solid var(--brass-soft);padding:6px;background:var(--surface);max-width:100%;}
  .modal-frame img{max-width:100%;max-height:66vh;display:block;}
  .modal-caption{text-align:center;color:var(--ink-dim);font-family:'Fraunces',serif;font-style:italic;font-size:14px;margin-top:14px;}
  .modal-close{position:absolute;top:20px;left:20px;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(8px);
    background:var(--surface);border:1px solid var(--brass-soft);color:var(--ink);
    padding:11px 18px;font-size:13px;font-family:'Inter',sans-serif;
    opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;z-index:60;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .sheet-bg{display:none;position:fixed;inset:0;background:rgba(6,6,7,0.85);z-index:55;align-items:flex-end;justify-content:center;}
  .sheet-bg.open{display:flex;}
  .sheet{background:var(--surface);border-top:1px solid var(--brass-soft);width:100%;max-width:500px;padding:18px 16px 26px;}
  .sheet h3{font-family:'Fraunces',serif;font-style:italic;font-weight:500;font-size:15px;color:var(--ink-dim);margin:0 0 12px;}
  .sheet-row{
    display:flex;align-items:center;justify-content:space-between;padding:13px 4px;
    border-bottom:1px solid var(--line-soft);cursor:pointer;color:var(--ink);font-size:14.5px;
  }
  .sheet-row:last-child{border-bottom:none;}
  .sheet-row .dot{width:7px;height:7px;border-radius:50%;background:var(--brass);opacity:0;}
  .sheet-row.selected .dot{opacity:1;}
  .sheet-row.new{color:var(--brass);font-style:italic;font-family:'Fraunces',serif;}

  .sheet-input{
    width:100%;background:var(--surface-2);border:1px solid var(--line);
    color:var(--ink);font-family:'Inter',sans-serif;font-size:15px;
    padding:12px 14px;outline:none;margin-bottom:12px;
  }
  .sheet-input:focus{border-color:var(--brass-soft);box-shadow:0 0 0 3px var(--brass-glow);}
  .sheet-cta{
    width:100%;background:var(--brass);color:#1a1400;border:none;
    font-family:'Fraunces',serif;font-weight:600;font-size:14.5px;
    padding:13px;cursor:pointer;
  }
  .sheet-cta:active{opacity:0.85;}
  .sheet-cta.secondary{
    background:var(--surface-2);color:var(--ink);border:1px solid var(--line);
    margin-top:8px;
  }

  @media (prefers-reduced-motion: reduce){*{transition:none !important;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark-row">
      <div class="mark-title">
        <div class="mark"></div>
        <h1>Arhiva</h1>
      </div>
      <button class="icon-btn" id="settingsBtn" title="Podešavanja">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"></path></svg>
      </button>
    </div>
    <p class="sub">Privatna arhiva dokumenata i slika</p>

    <div class="crumb" id="crumb">
      <button class="back-btn" id="crumbBack"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
      <span class="here" id="crumbName"></span>
    </div>

    <div class="sel-header" id="selHeader">
      <button class="cancel" id="selCancel">✕</button>
      <span class="count" id="selCount">1 odabrano</span>
      <button class="all" id="selAll">Izaberi sve</button>
    </div>

    <div class="searchbar" id="searchbarWrap">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.2" y2="16.2"></line>
      </svg>
      <input id="search" type="text" placeholder="Pretraži po nazivu...">
    </div>
  </header>

  <div class="toolbar" id="toolbarWrap">
    <span class="count" id="count">0 stavki</span>
    <div class="toolbar-actions">
      <button class="add-btn" id="addBtn" type="button">
        <span class="seal">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </span>
        <span class="label">Dodaj</span>
      </button>
    </div>
    <input id="fileInput" type="file" accept="image/*" multiple>
    <input id="docInput" type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.json,.zip,.rar,.7z,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/zip,application/x-rar-compressed,application/x-7z-compressed,text/plain,text/csv,application/json" multiple>
    <input id="cameraInput" type="file" accept="image/*" capture="environment">
  </div>

  <div id="contentArea"></div>
</div>

<div class="sel-bar" id="selBar">
  <button id="btnShare">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.6" y1="10.6" x2="15.4" y2="6.4"></line><line x1="8.6" y1="13.4" x2="15.4" y2="17.6"></line></svg>
    Podeli
  </button>
  <button id="btnAlbum">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h4l2 2.5h8a2 2 0 012 2V17a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path></svg>
    Dodaj u album
  </button>
  <button id="btnShortcut" hidden>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="M12 8v8M8 12h8"></path></svg>
    Prečica
  </button>
  <button id="btnDelete" class="danger">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"></path><path d="M10 11v6M14 11v6"></path></svg>
    Izbriši
  </button>
</div>

<div class="modal-bg" id="modalBg">
  <button class="back-btn modal-close" id="modalClose">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
  </button>
  <div>
    <div class="modal-frame"><img id="modalImg" src=""></div>
    <div class="modal-caption" id="modalCaption"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet">

/* ---------- Back-button (history) support ---------- */
let backStack = [];
function pushBack(closer){
  history.pushState({app:true, depth: backStack.length+1}, '');
  backStack.push(closer);
}
function requestClose(){
  if(backStack.length > 0){ history.back(); }
}
window.addEventListener('popstate', ()=>{
  if(backStack.length > 0){
    const fn = backStack.pop();
    fn();
  }
});

function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(()=>toastEl.classList.remove('show'), 2200);
}
function pad(n){ return String(n).padStart(3,'0'); }
function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function normalizeSr(s){
  return s.toLowerCase()
    .replace(/š/g,'s').replace(/č/g,'c').replace(/ć/g,'c')
    .replace(/ž/g,'z').replace(/đ/g,'d');
}

const LS_PREFIX = 'galerija:';

/* ---------- IndexedDB sloj za stavke (slike/dokumenti) ---------- */
const IDB_NAME = 'galerijaDB';
const IDB_STORE = 'items';
let _idbPromise = null;
function idbOpen(){
  if(_idbPromise) return _idbPromise;
  _idbPromise = new Promise((resolve, reject)=>{
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=>{
      const db = req.result;
      if(!db.objectStoreNames.contains(IDB_STORE)){
        db.createObjectStore(IDB_STORE, {keyPath:'id'});
      }
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
  return _idbPromise;
}
async function idbPut(item){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(item);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}
async function idbDelete(id){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).delete(id);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}
async function idbGetAll(){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).getAll();
    req.onsuccess = ()=>resolve(req.result || []);
    req.onerror = ()=>reject(req.error);
  });
}
async function migrateLegacyLocalStorageItems(){
  try{
    const raw = localStorage.getItem(LS_PREFIX+'item-ids');
    if(!raw) return;
    const ids = JSON.parse(raw);
    if(!Array.isArray(ids) || ids.length === 0){
      localStorage.removeItem(LS_PREFIX+'item-ids');
      return;
    }
    for(const id of ids){
      const raw2 = localStorage.getItem(LS_PREFIX+'item:'+id);
      if(raw2){
        try{ await idbPut(JSON.parse(raw2)); }catch(e){ console.error(e); }
        localStorage.removeItem(LS_PREFIX+'item:'+id);
      }
    }
    localStorage.removeItem(LS_PREFIX+'item-ids');
  }catch(e){
    console.error(e);
  }
}

async function loadAll(){
  try{
    const rawCats = localStorage.getItem(LS_PREFIX+'categories');
    let parsed = rawCats ? JSON.parse(rawCats) : [];
    categories = parsed.map(c => typeof c === 'string' ? {name:c, pinned:false, cover:null} : c);
    await migrateLegacyLocalStorageItems();
    const loaded = await idbGetAll();
    loaded.sort((a,b)=>a.ts-b.ts);
    items = loaded;
  }catch(e){
    console.error(e);
    toast('Greška pri učitavanju.');
    items = [];
  }
  render();
}
function saveCategories(){ localStorage.setItem(LS_PREFIX+'categories', JSON.stringify(categories)); }
function maybeAutoCover(folderName, item){
  if(!folderName || !item || item.type !== 'image') return;
  const cat = categories.find(c=>c.name===folderName);
  if(cat && !cat.cover){ cat.cover = item.id; saveCategories(); }
}
function saveIndex(){ /* IndexedDB čuva svaku stavku pojedinačno preko idbPut; ova funkcija više nije potrebna, ostavljena zbog kompatibilnosti poziva. */ }

function folderIconSvg(){

}
function pdfIconSvg(){
  return '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>';
}

  location.href = 'photo.html?p=' + encodeURIComponent(item.id);
}

const INBOX = '__inbox__';

function render(){
  crumb.classList.toggle('show', !!currentFolder && !selectionMode);
  if(currentFolder){ crumbName.textContent = currentFolder === INBOX ? 'Sve slike' : currentFolder; }
  selHeader.classList.toggle('show', selectionMode);
  selBar.classList.toggle('show', selectionMode);
  document.body.style.paddingBottom = selectionMode ? '90px' : '70px';
  searchbarWrap.style.display = selectionMode ? 'none' : 'flex';
  toolbarWrap.style.display = selectionMode ? 'none' : 'flex';
  document.getElementById('settingsBtn').style.display = selectionMode ? 'none' : 'flex';
  if(selectionMode){
    selCount.textContent = selectedIds.size + (selectedIds.size===1 ? ' odabrano' : ' odabrano');
    document.getElementById('btnShortcut').hidden = selectedIds.size !== 1;
  }

  const q = normalizeSr(searchEl.value.trim());

  if(currentFolder){
    let filtered = currentFolder === INBOX ? items.filter(i=>!i.category) : items.filter(i=>i.category === currentFolder);
    if(q) filtered = filtered.filter(i=>normalizeSr(i.name).includes(q));
    const totalHere = currentFolder === INBOX ? items.filter(i=>!i.category).length : items.filter(i=>i.category===currentFolder).length;
    countEl.innerHTML = '<b>' + totalHere + '</b> u albumu' + (q ? ' &middot; ' + filtered.length + ' prikazano' : '');
    contentArea.innerHTML = '';
    if(filtered.length === 0){
      const msg = q ? 'Nema rezultata za "'+escapeHtml(searchEl.value)+'".' : 'Ovaj album je prazan. Dodaj nešto dugmetom iznad.';
      contentArea.innerHTML = '<div class="empty"><b>'+(q?'Nema rezultata':'Album je prazan')+'</b><span>'+msg+'</span></div>';
      return;
    }
    const sortRow = document.createElement('div');
    sortRow.style.cssText = 'display:flex;justify-content:flex-end;gap:6px;margin-bottom:16px;';
    [['date','Datum'],['alpha','Abeceda']].forEach(([mode,label])=>{
      const btn = document.createElement('button');
      btn.textContent = label;
      const active = sortMode === mode;
      btn.style.cssText = 'font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;background:none;border:1px solid '+(active?'var(--brass)':'var(--line)')+';color:'+(active?'var(--brass)':'var(--ink-dim)')+';padding:7px 11px;cursor:pointer;';
      btn.onclick = ()=>{ sortMode = mode; render(); };
      sortRow.appendChild(btn);
    });
    contentArea.appendChild(sortRow);
    if(sortMode === 'alpha'){
      const sorted = filtered.slice().sort((a,b)=>normalizeSr(a.name).localeCompare(normalizeSr(b.name)));
      const grid = document.createElement('div');
      grid.className = 'grid photos-grid';
      sorted.forEach((item,i)=>grid.appendChild(buildCard(item, i+1)));
      contentArea.appendChild(grid);
    }else{
      contentArea.appendChild(buildDatedPhotoSections(filtered));
    }
    return;
  }

  countEl.innerHTML = '<b>' + items.length + '</b> ukupno';
  contentArea.innerHTML = '';

  const closeAlbumViewTop = ()=>{ currentFolder = null; searchEl.value=''; render(); };

  if(q){
    const matchedCats = categories.filter(c=>normalizeSr(c.name).includes(q));
    const inboxMatches = normalizeSr('Sve slike').includes(q);
    const matchedItems = items.filter(i=>normalizeSr(i.name).includes(q));

    if(!inboxMatches && matchedCats.length === 0 && matchedItems.length === 0){
      contentArea.innerHTML = '<div class="empty"><b>Nema rezultata</b><span>Nema rezultata za "'+escapeHtml(searchEl.value)+'".</span></div>';
      return;
    }

    if(inboxMatches || matchedCats.length > 0){
      const label = document.createElement('p');
      label.className = 'section-label';
      label.textContent = 'Albumi';
      contentArea.appendChild(label);
      if(inboxMatches){
        const inboxCount = items.filter(i=>!i.category).length;
        const inboxTile = document.createElement('div');
        inboxTile.className = 'folder-tile-wide';
        inboxTile.innerHTML = '<div class="fw-icon">'+folderIconSvg()+'</div><div class="fw-text"><span class="fw-name">Sve slike</span><span class="fw-count">'+inboxCount+' '+(inboxCount===1?'stavka':'stavki')+'</span></div>';
        inboxTile.onclick = ()=>{ currentFolder = INBOX; searchEl.value=''; pushBack(closeAlbumViewTop); render(); };
        contentArea.appendChild(inboxTile);
      }
      if(matchedCats.length > 0){
        const fgrid = document.createElement('div');
        fgrid.className = 'grid folders-grid';
        matchedCats.forEach(cat=>{
          const name = cat.name;
          const count = items.filter(i=>i.category===name).length;
          const tile = document.createElement('div');
          const coverItem = cat.cover ? items.find(i=>i.id===cat.cover) : null;
          tile.className = 'folder-tile';
          if(coverItem){
            tile.innerHTML = '<div class="ftile-cover"><img src="'+coverItem.dataUrl+'"></div><span class="fname">'+escapeHtml(name)+'</span><span class="fcount">'+count+' '+(count===1?'stavka':'stavki')+'</span>';
          }else{
            tile.innerHTML = '<div class="ftile-cover">'+folderIconSvg()+'</div><span class="fname">'+escapeHtml(name)+'</span><span class="fcount">'+count+' '+(count===1?'stavka':'stavki')+'</span>';
          }
          tile.onclick = ()=>{ currentFolder = name; searchEl.value=''; pushBack(closeAlbumViewTop); render(); };
          fgrid.appendChild(tile);
        });
        contentArea.appendChild(fgrid);
      }
    }

    if(matchedItems.length > 0){
      const label2 = document.createElement('p');
      label2.className = 'section-label';
      label2.textContent = 'Slike i dokumenti';
      contentArea.appendChild(label2);
      contentArea.appendChild(buildDatedPhotoSections(matchedItems));
    }
    return;
  }

  const label = document.createElement('p');
  label.className = 'section-label';
  label.textContent = 'Albumi';
  contentArea.appendChild(label);

  const closeAlbumView = ()=>{ currentFolder = null; searchEl.value=''; render(); };

  const inboxCount = items.filter(i=>!i.category).length;
  const inboxTile = document.createElement('div');
  inboxTile.className = 'folder-tile-wide';
  inboxTile.innerHTML = '<div class="fw-icon">'+folderIconSvg()+'</div><div class="fw-text"><span class="fw-name">Sve slike</span><span class="fw-count">'+inboxCount+' '+(inboxCount===1?'stavka':'stavki')+'</span></div>';
  inboxTile.onclick = ()=>{ currentFolder = INBOX; searchEl.value=''; pushBack(closeAlbumView); render(); };
  contentArea.appendChild(inboxTile);

  const fgrid = document.createElement('div');
  fgrid.className = 'grid folders-grid';

  categories.slice().sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)).forEach(cat=>{
    const name = cat.name;
    const count = items.filter(i=>i.category===name).length;
    const tile = document.createElement('div');
    const coverItem = cat.cover ? items.find(i=>i.id===cat.cover) : null;
    tile.className = 'folder-tile';
    if(coverItem){
      tile.innerHTML = '<div class="ftile-cover"><img src="'+coverItem.dataUrl+'"></div><span class="fname">'+escapeHtml(name)+'</span><span class="fcount">'+count+' '+(count===1?'stavka':'stavki')+'</span>';
    }else{
      tile.innerHTML = '<div class="ftile-cover">'+folderIconSvg()+'</div><span class="fname">'+escapeHtml(name)+'</span><span class="fcount">'+count+' '+(count===1?'stavka':'stavki')+'</span>';
    }
    if(cat.pinned){
      const pin = document.createElement('div');
      pin.className = 'pin-mark';
      pin.innerHTML = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 10a7 7 0 0114 0c0 3-2 5-2 5H7s-2-2-2-5z"></path></svg>';
      tile.querySelector('.ftile-cover').appendChild(pin);
    }

    let tilePressTimer = null;
    let tileLongFired = false;
    const startTilePress = ()=>{
      tileLongFired = false;
      tilePressTimer = setTimeout(()=>{ tileLongFired = true; openAlbumContext(name); }, 480);
    };
    const cancelTilePress = ()=>{ if(tilePressTimer){ clearTimeout(tilePressTimer); tilePressTimer=null; } };
    tile.addEventListener('touchstart', startTilePress, {passive:true});
    tile.addEventListener('touchend', cancelTilePress);
    tile.addEventListener('touchmove', cancelTilePress);
    tile.addEventListener('mousedown', startTilePress);
    tile.addEventListener('mouseup', cancelTilePress);
    tile.addEventListener('mouseleave', cancelTilePress);
    tile.onclick = ()=>{
      if(tileLongFired){ tileLongFired = false; return; }
      currentFolder = name; searchEl.value=''; pushBack(closeAlbumView); render();
    };
    fgrid.appendChild(tile);
  });
  contentArea.appendChild(fgrid);
}

function openAlbumContext(name){
  albumContextTarget = name;
  const cat = categories.find(c=>c.name===name);
  document.getElementById('albumContextTitle').textContent = name;
  document.getElementById('acPin').querySelector('span').textContent = cat && cat.pinned ? 'Otkači sa vrha' : 'Zakači na vrh';
  document.getElementById('albumContextSheet').classList.add('open');
  pushBack(closeAlbumContext);
}
const closeAlbumContext = ()=>{ albumContextTarget = null; document.getElementById('albumContextSheet').classList.remove('open'); };
document.getElementById('acPin').onclick = ()=>{
  const cat = categories.find(c=>c.name===albumContextTarget);
  if(cat){ cat.pinned = !cat.pinned; saveCategories(); }
  document.getElementById('albumContextSheet').classList.remove('open');
  render();
};
document.getElementById('acRename').onclick = ()=>{
  document.getElementById('albumContextSheet').classList.remove('open');
  openRenameSheet(albumContextTarget);
};
document.getElementById('acCover').onclick = ()=>{
  document.getElementById('albumContextSheet').classList.remove('open');
  openCoverPicker(albumContextTarget);
};
document.getElementById('acDelete').onclick = ()=>{
  document.getElementById('albumContextSheet').classList.remove('open');
  if(!confirm('Obrisati album "'+albumContextTarget+'"? Slike ostaju sačuvane u "Sve slike".')) return;
  const name = albumContextTarget;
  items.forEach(it=>{
    if(it.category === name){
      it.category = null;
      idbPut(it).catch(e=>console.error(e));
    }
  });
  categories = categories.filter(c=>c.name!==name);
  saveCategories();
  if(currentFolder === name) currentFolder = null;
  render();
  toast('Album obrisan.');
};
document.getElementById('acBack').onclick = ()=>requestClose();
document.getElementById('albumContextSheet').onclick = (e)=>{ if(e.target===document.getElementById('albumContextSheet')) requestClose(); };

function openCoverPicker(name){
  const pool = items.filter(i=>i.category===name && i.type === 'image');
  const grid = document.getElementById('coverPickerGrid');
  grid.innerHTML = '';
  document.getElementById('coverPickerSheet').classList.add('open');
  pushBack(closeCoverPicker);
  if(pool.length === 0){
    grid.innerHTML = '<p style="grid-column:1/-1;color:var(--ink-dim);font-size:13px;">Album je prazan, nema slika za naslovnu.</p>';
    return;
  }
  pool.forEach(it=>{
    const t = document.createElement('div');
    t.style.aspectRatio = '1/1';
    t.style.cursor = 'pointer';
    t.style.border = '1px solid var(--line)';
    t.innerHTML = '<img src="'+it.dataUrl+'" style="width:100%;height:100%;object-fit:cover;display:block;">';
    t.onclick = ()=>{
      const cat = categories.find(c=>c.name===name);
      if(cat){ cat.cover = it.id; saveCategories(); }
      document.getElementById('coverPickerSheet').classList.remove('open');
      render();
    };
    grid.appendChild(t);
  });
}
const closeCoverPicker = ()=>document.getElementById('coverPickerSheet').classList.remove('open');
document.getElementById('coverPickerBack').onclick = ()=>requestClose();
document.getElementById('coverPickerSheet').onclick = (e)=>{ if(e.target===document.getElementById('coverPickerSheet')) requestClose(); };

const MESECI = ['januar','februar','mart','april','maj','jun','jul','avgust','septembar','oktobar','novembar','decembar'];
function formatDateLabel(ts){
  const d = new Date(ts);
  const now = new Date();
  const sameDay = (a,b)=> a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  const yesterday = new Date(now); yesterday.setDate(now.getDate()-1);
  if(sameDay(d, now)) return 'Danas';
  if(sameDay(d, yesterday)) return 'Juče';
  const suffix = d.getFullYear() !== now.getFullYear() ? ' ' + d.getFullYear() + '.' : '';
  return d.getDate() + '. ' + MESECI[d.getMonth()] + suffix;
}

function buildCard(item, indexNumber){
  const card = document.createElement('div');
  card.className = 'card' + (selectionMode ? ' selectable' : '') + (selectedIds.has(item.id) ? ' selected' : '');

  const thumbBox = document.createElement('div');
  const isPdf = item.type === 'pdf';
  const isDoc = item.type === 'doc';
  thumbBox.className = 'thumb-box' + ((isPdf || isDoc) ? ' pdf-thumb' : '');
  const corner = document.createElement('div');
  corner.className = 'corner';
  if(isPdf || isDoc){
    thumbBox.innerHTML = pdfIconSvg() + '<span class="pdf-label">'+(isPdf ? 'PDF' : (item.ext || 'FAJL'))+'</span>';
    thumbBox.appendChild(corner);
  }else{
    const img = document.createElement('img');
    img.src = item.dataUrl;
    img.loading = 'lazy';
    thumbBox.appendChild(img);
    thumbBox.appendChild(corner);
  }
  card.appendChild(thumbBox);

  const mark = document.createElement('div');
  mark.className = 'select-mark';
  mark.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
  card.appendChild(mark);

  thumbBox.addEventListener('contextmenu', (e)=>{
    e.preventDefault();
    if(!selectionMode){ enterSelectionMode(); }
    toggleSelect(item.id);
  });

  thumbBox.onclick = (e)=>{
    if(selectionMode){ toggleSelect(item.id); }
    else if(isPdf || isDoc){ openPdf(item); }
    else{ openModal(item); }
  };

  const meta = document.createElement('div');
  meta.className = 'meta';
  const idx = document.createElement('span');
  idx.className = 'index';
  idx.textContent = 'N\u00B0 ' + pad(indexNumber);
  const nameSpan = document.createElement('span');
  nameSpan.className = 'name';
  nameSpan.textContent = item.name;
  nameSpan.title = 'Dodirni da preimenuješ';
  nameSpan.onclick = (e)=>{ e.stopPropagation(); if(!selectionMode) startRename(item, nameSpan, meta, idx); };
  meta.appendChild(idx);
  meta.appendChild(nameSpan);
  card.appendChild(meta);

  return card;
}

function buildDatedPhotoSections(list){
  const frag = document.createDocumentFragment();
  const sorted = list.slice().sort((a,b)=>b.ts-a.ts);
  let lastKey = null;
  let currentGrid = null;
  let idx = 0;
  sorted.forEach(item=>{
    const d = new Date(item.ts);
    const key = d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();
    if(key !== lastKey){
      lastKey = key;
      const label = document.createElement('p');
      label.className = 'date-label';
      label.textContent = formatDateLabel(item.ts);
      frag.appendChild(label);
      currentGrid = document.createElement('div');
      currentGrid.className = 'grid photos-grid';
      frag.appendChild(currentGrid);
    }
    idx++;
    currentGrid.appendChild(buildCard(item, idx));
  });
  return frag;
}

function enterSelectionMode(){
  selectionMode = true;
  selectedIds = new Set();
  pushBack(closeSelectionMode);
}
const closeSelectionMode = ()=>{ selectionMode = false; selectedIds = new Set(); render(); };
function toggleSelect(id){
  if(selectedIds.has(id)) selectedIds.delete(id);
  else selectedIds.add(id);
  if(selectedIds.size === 0){
    selectionMode = false;
    render();
    return;
  }
  render();
}
function exitSelection(){
  selectionMode = false;
  selectedIds = new Set();
  render();
}
selCancel.onclick = ()=>requestClose();
selAll.onclick = ()=>{
  const visible = currentFolder === INBOX
    ? items.filter(i=>!i.category)
    : items.filter(i=>i.category===currentFolder);
  const q = normalizeSr(searchEl.value.trim());
  const pool = q ? visible.filter(i=>normalizeSr(i.name).includes(q)) : visible;
  if(selectedIds.size === pool.length && selectionMode){
    requestClose();
  }else{
    if(!selectionMode){ selectionMode = true; pushBack(closeSelectionMode); }
    selectedIds = new Set(pool.map(i=>i.id));
    render();
  }
};

function startRename(item, nameSpan, meta, idx){
  const input = document.createElement('input');
  input.value = item.name;
  meta.replaceChild(input, nameSpan);
  input.focus();
  input.select();
  const commit = ()=>{
    const newName = input.value.trim() || item.name;
    item.name = newName;
    idbPut(item).catch(e=>{ console.error(e); toast('Greška pri čuvanju naziva.'); });
    render();
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter') input.blur();
    if(e.key === 'Escape'){ input.value = item.name; input.blur(); }
  });
}

function moveSelectedToFolder(folderName){
  const ids = Array.from(selectedIds);
  ids.forEach(id=>{
    const item = items.find(i=>i.id===id);
    if(item){
      item.category = folderName || null;
      idbPut(item).catch(e=>console.error(e));
      maybeAutoCover(folderName, item);
    }
  });
  exitSelection();
  toast(folderName ? 'Premešteno u "'+folderName+'".' : 'Uklonjeno iz albuma.');
}
function copySelectedToFolder(folderName){
  const ids = Array.from(selectedIds);
  ids.forEach(id=>{
    const orig = items.find(i=>i.id===id);
    if(orig){
      const newId = 'i' + Date.now() + Math.random().toString(36).slice(2,8);
      const clone = { id:newId, name:orig.name, dataUrl:orig.dataUrl, ts:Date.now(), category:folderName || null, type: orig.type, ext: orig.ext };
      items.push(clone);
      idbPut(clone).catch(e=>console.error(e));
      maybeAutoCover(folderName, clone);
    }
  });
  exitSelection();
  toast('Kopirano u "'+folderName+'".');
}

function deleteSelected(){
  if(selectedIds.size === 0) return;
  if(!confirm(selectedIds.size===1 ? 'Obrisati ovu stavku?' : 'Obrisati '+selectedIds.size+' stavki?')) return;
  const ids = Array.from(selectedIds);
  items = items.filter(i=>!selectedIds.has(i.id));
  ids.forEach(id=>{ idbDelete(id).catch(e=>console.error(e)); });
  exitSelection();
  toast('Obrisano.');
}
document.getElementById('btnDelete').onclick = deleteSelected;
document.getElementById('btnAlbum').onclick = openMoveSheet;

async function shareSelected(){
  const ids = Array.from(selectedIds);
  const chosen = items.filter(i=>ids.includes(i.id));
  if(chosen.length === 0) return;
  try{
    const files = await Promise.all(chosen.map(async (it, idx)=>{
      const res = await fetch(it.dataUrl);
      const blob = await res.blob();
      const ext = (blob.type.split('/')[1] || 'jpg').replace('jpeg','jpg');
      return new File([blob], (it.name||'slika')+'.'+ext, {type: blob.type});
    }));
    if(navigator.canShare && navigator.canShare({files})){
      await navigator.share({files});
    }else{
      toast('Deljenje nije podržano u ovom browseru.');
    }
  }catch(e){
    if(e && e.name !== 'AbortError'){ toast('Deljenje nije uspelo.'); }
  }
}
document.getElementById('btnShare').onclick = shareSelected;

document.getElementById('btnShortcut').onclick = ()=>{

function openNewFolderSheet(assignToItemId){

  renamingAlbum = null;
  document.getElementById('newFolderTitle').textContent = 'Novi album';
  document.getElementById('newFolderCreate').textContent = 'Napravi album';

function openRenameSheet(oldName){
  pendingAssignItemId = null;
  renamingAlbum = oldName;
  document.getElementById('newFolderTitle').textContent = 'Preimenuj album';
  document.getElementById('newFolderCreate').textContent = 'Sačuvaj';
  newFolderInput.value = oldName;
  newFolderSheet.classList.add('open');
  pushBack(closeNewFolderSheet);
  setTimeout(()=>{ newFolderInput.focus(); newFolderInput.select(); }, 50);
}
const closeNewFolderSheet = ()=>{ newFolderSheet.classList.remove('open'); pendingAssignItemId=null; renamingAlbum=null; };
function createFolder(){
  const name = newFolderInput.value.trim();
  if(!name){ newFolderInput.focus(); return; }

  if(renamingAlbum){
    if(name !== renamingAlbum && categories.some(c=>c.name===name)){
      toast('Album s tim imenom već postoji.');
      return;
    }
    const cat = categories.find(c=>c.name===renamingAlbum);
    if(cat){
      const oldName = cat.name;
      cat.name = name;
      saveCategories();
      items.forEach(it=>{
        if(it.category === oldName){
          it.category = name;
          idbPut(it).catch(e=>console.error(e));
        }
      });
      if(currentFolder === oldName) currentFolder = name;
    }
    newFolderSheet.classList.remove('open');
    renamingAlbum = null;
    render();
    toast('Album preimenovan.');
    return;
  }

  if(!categories.some(c=>c.name===name)){
    categories.push({name, pinned:false, cover:null});
    saveCategories();
  }
  newFolderSheet.classList.remove('open');
  if(pendingAssignItemId === 'bulk'){
    pendingAssignItemId = null;
    openMoveCopySheet(name, name);
  }else if(pendingAssignItemId){
    pendingAssignItemId = null;
  }else{
    currentFolder = name;
    render();
    toast('Album "'+name+'" napravljen.');
  }
}
document.getElementById('newFolderCreate').onclick = createFolder;
document.getElementById('newFolderBack').onclick = ()=>requestClose();
newFolderInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') createFolder(); });

function readFileAsDataUrl(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
function compressImage(file){
  return new Promise((resolve, reject)=>{
    const MAX_DIM = 1600;
    const QUALITY = 0.85;
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > MAX_DIM || h > MAX_DIM){
          if(w > h){ h = Math.round(h * MAX_DIM / w); w = MAX_DIM; }
          else{ w = Math.round(w * MAX_DIM / h); h = MAX_DIM; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', QUALITY));
      };
      img.onerror = ()=>resolve(e.target.result); // fallback: use uncompressed if decode fails
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function addFile(file, category){
  try{
    const isPdf = file.type === 'application/pdf';
    const isImage = file.type.startsWith('image/');
    const isDoc = !isPdf && !isImage;
    const dataUrl = isImage ? await compressImage(file) : await readFileAsDataUrl(file);
    const id = 'i' + Date.now() + Math.random().toString(36).slice(2,8);
    const baseName = file.name.replace(/\.[^.]+$/, '');
    const ext = (file.name.match(/\.([^.]+)$/) || [,''])[1].toUpperCase();
    const item = {
      id,
      name: baseName || (isPdf ? 'Dokument' : (isDoc ? 'Dokument' : 'Slika')),
      dataUrl,
      ts: Date.now(),
      category: category || null,
      type: isPdf ? 'pdf' : (isDoc ? 'doc' : 'image'),
      ext: isDoc ? ext : undefined
    };
    await idbPut(item);
    items.push(item);
    maybeAutoCover(category, item);
    render();
  }catch(e){
    console.error(e);
    if(e && (e.name === 'QuotaExceededError' || (e.target && e.target.error && e.target.error.name === 'QuotaExceededError'))){ toast('Nema više prostora za nove stavke u browseru.'); }
    else{ toast('Greška pri dodavanju.'); }
  }
}

searchEl.addEventListener('input', render);

loadAll().then(checkDeepLink);

/* ---------- Podešavanja: rezervna kopija ---------- */
const settingsSheet = document.getElementById('settingsSheet');
const closeSettingsSheet = ()=>settingsSheet.classList.remove('open');
document.getElementById('settingsBtn').onclick = ()=>{
  updateStorageInfo();
  settingsSheet.classList.add('open');
  pushBack(closeSettingsSheet);
};
document.getElementById('settingsBack').onclick = ()=>requestClose();
settingsSheet.onclick = (e)=>{ if(e.target === settingsSheet) requestClose(); };

function updateStorageInfo(){
  let bytes = 0;
  items.forEach(it=>{ bytes += (it.dataUrl ? it.dataUrl.length : 0); });
  const mb = bytes / 1024 / 1024;
  document.getElementById('storageInfo').textContent = 'Iskorišćeno: ~' + mb.toFixed(1) + ' MB \u00B7 ' + items.length + ' stavki';
}

function exportBackup(){
  const data = {
    version: 1,
    exportedAt: new Date().toISOString(),
    categories: categories,
    items: items
  };
  const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = 'arhiva-backup-' + stamp + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  toast('Rezervna kopija sačuvana.');
}
document.getElementById('settingsExport').onclick = exportBackup;

const importInput = document.getElementById('importInput');
document.getElementById('settingsImport').onclick = ()=>importInput.click();
importInput.addEventListener('change', (e)=>{
  const file = e.target.files && e.target.files[0];
  importInput.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (ev)=>{
    try{
      const data = JSON.parse(ev.target.result);
      if(!data || !Array.isArray(data.items)) throw new Error('bad format');
      (data.categories || []).forEach(c=>{
        const catObj = typeof c === 'string' ? {name:c} : c;
        if(catObj && catObj.name && !categories.some(existing=>existing.name === catObj.name)){
          categories.push({name: catObj.name, pinned: !!catObj.pinned, cover: null});
        }
      });
      saveCategories();
      let added = 0;
      for(const it of data.items){
        if(!it || !it.dataUrl) continue;
        const newId = 'i' + Date.now() + Math.random().toString(36).slice(2,8);
        const clone = {
          id: newId,
          name: it.name || 'Stavka',
          dataUrl: it.dataUrl,
          ts: it.ts || Date.now(),
          category: it.category && categories.some(c=>c.name===it.category) ? it.category : null,
          type: it.type === 'pdf' ? 'pdf' : (it.type === 'doc' ? 'doc' : 'image'),
          ext: it.ext
        };
        items.push(clone);
        try{ await idbPut(clone); }catch(err){ console.error(err); }
        added++;
      }
      updateStorageInfo();
      render();
      toast('Uvezeno ' + added + ' stavki.');
    }catch(err){
      console.error(err);
      toast('Fajl nije prepoznat kao rezervna kopija.');
    }
  };
  reader.readAsText(file);
});

function checkDeepLink(){
  const hashMatch = location.hash.match(/^#p=(.+)$/);
  const queryMatch = location.search.match(/[?&]p=([^&]+)/);
  const m = hashMatch || queryMatch;
  if(m){
    const id = decodeURIComponent(m[1]);
    const item = items.find(i=>i.id === id);
    if(item){
      document.title = item.name;
      if(item.type === 'pdf' || item.type === 'doc'){ openPdf(item); }
      else{ openModal(item); }
    }
  }
}
