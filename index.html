<style>
  :root{
    --bg:#0d0e10;
    --surface:#17181b;
    --surface-2:#1f2124;
    --line:#2a2c30;
    --line-soft:#232529;
    --ink:#ede9e1;
    --ink-dim:#8b8d92;
    --ink-faint:#5c5e63;
    --brass:#c9a355;
    --brass-soft:#8a7240;
    --brass-glow:rgba(201,163,85,0.22);
    --danger:#b5544a;
    /* tokeni za teme; podrazumevane vrednosti = tacno dosadasnje boje (tema Klasicna) */
    --accent:#c9a355;
    --on-accent:#1a1400;
    --on-danger:#fff;
    --on-danger-soft:rgba(255,255,255,0.2);
    --on-danger-line:rgba(255,255,255,0.4);
    --danger-soft:rgba(181,84,74,0.16);
    --danger-line:rgba(181,84,74,0.4);
    --page-bg:radial-gradient(ellipse 900px 500px at 50% -10%, rgba(201,163,85,0.06), transparent 60%),radial-gradient(ellipse 800px 600px at 100% 100%, rgba(255,255,255,0.02), transparent 60%),var(--bg);
    --scrim:rgba(6,6,7,0.85);
    --scrim-strong:rgba(6,6,7,0.92);
    --mark-bg:rgba(13,14,16,0.82);
    --nav-bg:rgba(13,14,16,0.6);
    --shadow-drag:0 10px 26px rgba(0,0,0,0.55);
    --corner-shadow:drop-shadow(0 1px 2px rgba(0,0,0,0.4));
    --font-title:'TR Fraunces',serif;
    --font-ui:'TR Inter',sans-serif;
    --font-num:'TR Plex Mono',monospace;
    --font-name:var(--font-title);
    --name-style:italic;
    --title-color:var(--ink);
    --on-brass:#1a1400;
  }
  *{box-sizing:border-box;}
  html,body{overscroll-behavior-y:contain;}
  html{-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    background:var(--page-bg);
    color:var(--ink);
    font-family:var(--font-ui);
    min-height:100vh;
    padding:28px 18px 70px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:900px;margin:0 auto;}

  header{margin-bottom:10px;}
  #backupReminderRow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--danger);color:var(--on-danger);font-size:12px;font-weight:600;padding:9px 11px;border-radius:11px;margin-bottom:10px;}
  #backupReminderRow button{flex:none;background:var(--on-danger-soft);color:var(--on-danger);border:1px solid var(--on-danger-line);padding:6px 11px;border-radius:8px;font-weight:700;font-size:11.5px;font-family:inherit;cursor:pointer;}
  #stickyTop{
    position:sticky;top:-28px;z-index:20;background:var(--bg);
    padding-top:28px;margin-top:-28px;padding-bottom:10px;
  }
  .mark-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:0;}
  .mark-title{display:flex;align-items:center;gap:10px;}
  .mark{width:15px;height:15px;border:2px solid var(--brass);transform:rotate(45deg);flex:none;}
  h1{
    font-family:var(--font-title);font-weight:600;font-size:25px;
    letter-spacing:2px;text-transform:uppercase;margin:0;color:var(--ink);
  }
  .sub{color:var(--ink-dim);font-size:15px;margin:2px 0 0 25px;font-style:var(--name-style);font-family:var(--font-name);}

  .crumb{display:flex;align-items:center;gap:12px;min-width:0;flex:1;cursor:pointer;}
  .crumb .here{font-family:var(--font-name);font-style:var(--name-style);color:var(--ink);font-size:23px;line-height:1.2;
    white-space:normal;overflow-wrap:anywhere;min-width:0;}
  .crumb .crumb-count{font-family:var(--font-num);font-size:11px;letter-spacing:0.5px;color:var(--ink-dim);white-space:nowrap;flex:none;}
  .header-actions{display:flex;align-items:center;gap:10px;}

  .back-btn{
    width:42px;height:42px;border-radius:50%;flex:none;
    border:1px solid var(--line);background:var(--surface);color:var(--ink);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:border-color .2s, color .2s;
  }
  .back-btn:hover, .back-btn:active{border-color:var(--brass-soft);color:var(--brass);}
  .sheet-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .sheet-head h3{margin:0;}

  /* ---------- Selection header ---------- */
  .sel-header{
    display:none;
    align-items:center;
    justify-content:space-between;
    margin-top:18px;
  }
  .sel-header.show{display:flex;}
  .sel-header button{
    background:none;border:none;cursor:pointer;
    font-family:var(--font-ui);
  }
  .sel-header .cancel{
    color:var(--ink);font-size:20px;line-height:1;
    width:30px;height:30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line);
  }
  .sel-header .count{
    font-family:var(--font-name);font-style:var(--name-style);font-size:16.5px;color:var(--ink);
  }
  .sel-header .all{color:var(--brass);font-size:14.5px;letter-spacing:0.3px;}

  /* ---------- Bottom action bar ---------- */
  .sel-bar{
    display:none;
    position:fixed;bottom:0;left:0;right:0;
    background:var(--surface);
    border-top:1px solid var(--brass-soft);
    padding:12px 10px calc(12px + env(safe-area-inset-bottom));
    justify-content:space-around;
    z-index:40;
  }
  .sel-bar.show{display:flex;}
  .sel-bar button{
    background:none;border:none;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:5px;
    color:var(--ink-dim);
    font-family:var(--font-ui);font-size:12.5px;
    padding:4px 10px;
  }
  .sel-bar button svg{stroke:var(--ink-dim);}
  .sel-bar button.danger{color:var(--danger);}
  .sel-bar button.danger svg{stroke:var(--danger);}
  .sel-bar button:active{opacity:0.6;}
  .sel-bar button[hidden]{display:none;}


  .searchbar{
    display:flex;align-items:center;gap:10px;
    background:var(--surface);border:1px solid var(--line);border-radius:4px;
    padding:12px 14px;margin-top:10px;
    transition:border-color .2s, box-shadow .2s;
  }
  .searchbar:focus-within{border-color:var(--brass-soft);box-shadow:0 0 0 3px var(--brass-glow);}
  .searchbar svg{flex:none;stroke:var(--ink-faint);transition:stroke .2s;}
  .searchbar:focus-within svg{stroke:var(--brass);}
  .searchbar input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--ink);font-family:var(--font-ui);font-size:16.5px;}
  .searchbar input::placeholder{color:var(--ink-faint);}

  .toolbar{
    display:flex;justify-content:space-between;align-items:center;
    margin:22px 0 20px;padding-bottom:14px;border-bottom:1px solid var(--line-soft);
  }
  .count{font-family:var(--font-num);font-size:16.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-dim);}
  .count b{color:var(--ink);font-weight:600;font-size:18.5px;}
  .add-btn{display:flex;align-items:center;gap:9px;background:none;border:none;cursor:pointer;padding:2px;font-family:inherit;}
  .add-btn .seal{
    width:34px;height:34px;border-radius:50%;border:1.5px solid var(--brass);
    display:flex;align-items:center;justify-content:center;color:var(--brass);
    transition:background .2s, box-shadow .2s, transform .15s;flex:none;
  }
  .add-btn:active .seal{transform:scale(0.93);}
  .add-btn .seal:hover, .add-btn:focus-visible .seal{background:var(--brass-glow);box-shadow:0 0 0 4px var(--brass-glow);}
  .add-btn .label{font-family:var(--font-name);font-style:var(--name-style);font-size:16px;color:var(--ink-dim);}
  input[type=file]{display:none;}

  .toolbar-actions{display:flex;align-items:center;gap:14px;}
  .icon-btn{
    width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--ink-dim);
    cursor:pointer;background:none;flex:none;
    transition:border-color .2s, color .2s;
  }
  .icon-btn:active{transform:scale(0.93);}
  .icon-btn:hover, .icon-btn:focus-visible{border-color:var(--brass-soft);color:var(--brass);}
  .search-close{
    background:none;border:none;color:var(--ink-faint);cursor:pointer;flex:none;
    display:flex;align-items:center;justify-content:center;padding:2px;
  }
  .search-close:active{color:var(--brass);}
  .deep-search-toggle{
    flex:none;background:none;border:1px solid var(--line);color:var(--ink-faint);
    font-family:var(--font-num);font-size:10.5px;letter-spacing:0.5px;
    padding:6px 9px;cursor:pointer;border-radius:3px;white-space:nowrap;transition:border-color .2s,color .2s;
  }
  .deep-search-toggle.active{border-color:var(--brass);color:var(--brass);background:var(--brass-glow);}

  .section-label{
    font-family:var(--font-num);font-size:11.5px;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--ink-faint);margin:0 0 12px;
  }
  .section-label-top{margin-top:0;}
  .grid + .section-label{margin-top:22px;}
  .date-label{
    font-family:var(--font-name);font-style:var(--name-style);font-size:15.5px;color:var(--ink-dim);
    margin:26px 0 12px;
  }
  .date-label:first-child{margin-top:0;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:18px 14px;}
  .album-summary{
    font-family:var(--font-name);font-style:var(--name-style);font-size:19px;color:var(--ink);
    margin:0 0 14px;
  }
  .album-summary .count-part{font-size:15.5px;color:var(--ink-dim);margin-left:2px;}
  .grid.folders-grid{grid-template-columns:repeat(3,1fr);gap:10px 8px;}
  .grid.folders-grid.folders-list{display:flex;flex-direction:column;gap:8px;}
  /* Razmak izmedju grupe pinovanih i grupe ostalih albuma = isti kao izmedju plocica */
  .grid.folders-grid + .grid.folders-grid{margin-top:10px;}
  .grid.folders-grid.folders-list + .grid.folders-grid.folders-list{margin-top:8px;}
  .grid.photos-grid{grid-template-columns:repeat(3,1fr);gap:10px 8px;}
  .photos-grid .meta .name{font-size:15.5px;}
  .photos-grid .meta .index{font-size:10px;}
  .photos-grid .pdf-thumb svg{width:22px;height:22px;}
  .photos-grid .pdf-thumb .pdf-label{font-size:9.5px;}
  .folders-grid .folder-tile .fname{font-size:15.5px;}
  .folders-grid .folder-tile .fcount{font-size:12.5px;}

  .album-summary-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .album-summary-row .album-summary{margin:0;}
  .view-toggle-btn{
    width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--ink-dim);
    cursor:pointer;background:none;flex:none;transition:border-color .2s, color .2s;
  }
  .view-toggle-btn:active{transform:scale(0.93);}
  .view-toggle-btn:hover, .view-toggle-btn:focus-visible{border-color:var(--brass-soft);color:var(--brass);}

  .folder-tile-row{
    display:flex;align-items:center;gap:12px;box-sizing:border-box;width:100%;
    background:var(--surface);border:1px solid var(--line);
    padding:31px 14px;cursor:pointer;position:relative;transition:border-color .2s;
    touch-action:pan-y;
  }
  .folder-tile-row:active{border-color:var(--brass-soft);}
  .folder-tile-row .ftile-cover{
    /* Kvadrat preko cele unutrasnje visine plocice (44 + 2x12 razmaka = 68px);
       negativne margine ponistavaju padding, pa visina plocice ostaje ista */
    width:106px;height:106px;margin:-31px 0 -31px -14px;flex-shrink:0;border-radius:0;overflow:hidden;
    background:var(--surface-2);display:flex;align-items:center;justify-content:center;position:relative;
  }
  .folder-tile-row .ftile-cover img{width:100%;height:100%;object-fit:cover;}
  .folder-tile-row .ftile-cover svg{stroke:var(--brass);width:18px;height:18px;}
  .folder-tile-row .fr-text{display:flex;flex-direction:column;min-width:0;flex:1;}
  .folder-tile-row .fname{
    font-family:var(--font-name);font-style:var(--name-style);font-size:17px;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .folder-tile-row .fcount{
    font-family:var(--font-num);font-size:12px;color:var(--ink-faint);margin-top:2px;
  }

  .inbox-row{display:flex;flex-direction:column;align-items:stretch;gap:10px;margin-bottom:10px;}
  .inbox-row .folder-tile-wide{width:100%;padding-right:70px;}
  /* Veliko dugme za dodavanje (kvadrat) */
  .add-sq{display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--brass);
    border:none;padding:0;cursor:pointer;transition:background .2s;}
  .add-sq:active{background:var(--brass-glow);}
  .folder-tile-wide .add-sq{position:absolute;top:0;right:0;bottom:0;border-left:1px solid var(--line);}
  .add-sq.album-add{width:48px;height:48px;flex:none;border:1px solid var(--line);}
  .folder-tile-wide{
    width:50%;flex:none;display:flex;align-items:center;gap:10px;box-sizing:border-box;
    background:var(--surface);border:1px solid var(--line);
    padding:9px 12px;cursor:pointer;margin-bottom:0;position:relative;transition:border-color .2s;
  }
  .folder-tile-wide:active{border-color:var(--brass-soft);}
  .folder-tile-wide .fw-icon{
    width:32px;height:32px;flex-shrink:0;border-radius:50%;
    background:var(--surface-2);display:flex;align-items:center;justify-content:center;
  }
  .folder-tile-wide .fw-icon svg{stroke:var(--brass);width:13px;height:13px;}
  .folder-tile-wide .fw-text{display:flex;flex-direction:column;min-width:0;}
  .folder-tile-wide .fw-name{
    font-family:var(--font-name);font-style:var(--name-style);font-size:15.5px;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .folder-tile-wide .fw-count{
    font-family:var(--font-num);font-size:10.5px;color:var(--ink-faint);margin-top:1px;
  }
  .inbox-row .album-summary{margin:0;min-width:0;}

  .folder-tile{
    display:flex;flex-direction:column;gap:6px;min-width:0;
    cursor:pointer;position:relative;touch-action:pan-y;
    -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;
  }
  .drag-handle{
    position:absolute;display:flex;align-items:center;justify-content:center;
    width:30px;height:30px;color:var(--ink-faint);touch-action:none;z-index:3;
    cursor:grab;
  }
  .folder-tile .drag-handle{bottom:2px;right:2px;top:auto;}
  .folder-tile-row .drag-handle{top:50%;right:2px;transform:translateY(-50%);}
  .drag-handle:active{color:var(--brass);}
  .tile-dragging{transform:scale(1.06);box-shadow:var(--shadow-drag);opacity:0.96;}
  .drag-placeholder{border:1.5px dashed var(--brass-soft);background:var(--brass-glow);border-radius:2px;}
  .folder-tile .ftile-cover{
    aspect-ratio:1/1;background:var(--surface);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    position:relative;transition:border-color .2s;
  }
  .folder-tile:active .ftile-cover{border-color:var(--brass-soft);}
  .folder-tile svg{stroke:var(--brass);}
  .folder-tile .ftile-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .folder-tile .fname{
    display:block;font-family:var(--font-name);font-style:var(--name-style);font-size:16px;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
    height:18px;line-height:18px;
  }
  .folder-tile .fcount{display:block;font-family:var(--font-num);font-size:12px;color:var(--ink-faint);height:14px;line-height:14px;}
  .pin-mark{
    position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;
    background:var(--accent);display:flex;align-items:center;justify-content:center;z-index:2;
    font-family:var(--font-title);font-weight:600;font-size:14px;line-height:1;color:var(--on-accent);
  }
  .pin-mark svg{stroke:var(--on-accent);}

  .card{position:relative;cursor:pointer;}
  .thumb-box{
    position:relative;aspect-ratio:1/1;background:var(--surface-2);
    border:1px solid var(--line);overflow:hidden;transition:border-color .2s;
    -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;
  }
  .card:active .thumb-box{border-color:var(--brass-soft);}
  .thumb-box img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb-box.pdf-thumb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--brass);}
  .thumb-box.pdf-thumb .pdf-label{font-family:var(--font-num);font-size:11px;letter-spacing:1.5px;}

  .corner{
    position:absolute;top:0;left:0;width:0;height:0;
    border-style:solid;border-width:16px 16px 0 0;
    border-color:var(--brass) transparent transparent transparent;
    opacity:0.88;filter:var(--corner-shadow);
  }

  .select-mark{
    position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:50%;
    background:var(--mark-bg);border:1.5px solid var(--brass-soft);
    display:none;align-items:center;justify-content:center;
    transition:background .15s, border-color .15s;
  }
  .select-mark svg{width:16px;height:16px;}
  .card.selectable .select-mark{display:flex;}
  .card.selected .select-mark{background:var(--accent);border-color:var(--accent);}
  .select-mark svg{opacity:0;stroke:var(--on-accent);stroke-width:3;}
  .card.selected .select-mark svg{opacity:1;}
  .card.selected .thumb-box{border-color:var(--brass);}

  .meta{padding:8px 1px 0;}
  .meta .index{display:block;font-family:var(--font-num);font-size:11px;letter-spacing:1px;color:var(--brass-soft);margin-bottom:2px;}
  .meta .name{display:block;font-family:var(--font-name);font-style:var(--name-style);font-size:19.5px;color:var(--ink);white-space:normal;overflow-wrap:break-word;line-height:1.3;}
  .meta input{background:none;border:none;border-bottom:1px solid var(--brass);outline:none;color:var(--ink);font-size:19.5px;font-family:var(--font-name);font-style:var(--name-style);width:100%;padding:0;}

  .empty{text-align:center;padding:56px 20px;color:var(--ink-dim);border:1px solid var(--line-soft);position:relative;}
  .empty::before{content:'';position:absolute;inset:8px;border:1px dashed var(--line);pointer-events:none;}
  .empty .mark{margin:0 auto 14px;}
  .empty b{display:block;color:var(--ink);font-family:var(--font-name);font-style:var(--name-style);font-size:17.5px;font-weight:500;margin-bottom:6px;}
  .empty span{font-size:14.5px;}

  .modal-bg{display:none;position:fixed;inset:0;background:var(--bg);z-index:50;padding:0;}
  .modal-bg.open{display:block;}
  /* slika preko celog ekrana; dugmad i natpisi lebde iznad nje */
  .modal-inner{position:absolute;inset:0;}
  .modal-frame{position:absolute;inset:0;padding:0;border:none;background:none;}
  .modal-frame img{width:100%;height:100%;object-fit:contain;display:block;
    -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}
  .modal-info{
    position:absolute;left:0;right:0;bottom:0;z-index:2;pointer-events:none;
    padding:36px 20px calc(16px + env(safe-area-inset-bottom, 0px));
    background:linear-gradient(to top, color-mix(in srgb, var(--bg) 88%, transparent), transparent);
  }
  .modal-caption{text-align:center;color:var(--ink-dim);font-family:var(--font-name);font-style:var(--name-style);font-size:16px;margin:0;}
  .modal-close{position:absolute;top:calc(20px + env(safe-area-inset-top, 0px));left:20px;z-index:3;}
  .modal-del{position:absolute;top:calc(20px + env(safe-area-inset-top, 0px));right:20px;z-index:3;color:var(--danger);}
  .modal-bg .modal-close, .modal-bg .modal-del, .modal-bg .modal-nav{transition:opacity .22s ease, border-color .2s, color .2s;}
  .modal-bg .modal-info{transition:opacity .22s ease;}
  /* jedan dodir na sliku sakriva / vraca dugmad i natpise */
  .modal-bg.ui-hidden .modal-close, .modal-bg.ui-hidden .modal-del,
  .modal-bg.ui-hidden .modal-nav, .modal-bg.ui-hidden .modal-info{opacity:0;pointer-events:none;}
  .modal-del:hover, .modal-del:active{border-color:var(--danger-line);color:var(--danger);}
  .modal-nav{
    position:absolute;top:50%;transform:translateY(-50%);z-index:3;
    width:42px;height:42px;border-radius:50%;background:var(--nav-bg);
    border:1.5px solid var(--line);color:var(--ink-dim);display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:border-color .2s, color .2s;
  }
  .modal-nav:active{transform:translateY(-50%) scale(0.93);}
  .modal-nav:hover, .modal-nav:focus-visible{border-color:var(--brass-soft);color:var(--brass);}
  .modal-nav.prev{left:4px;}
  .modal-nav.next{right:4px;}
  .modal-nav[hidden]{display:none;}
  .modal-position{
    text-align:center;font-family:var(--font-num);font-size:11px;letter-spacing:1px;
    color:var(--ink-faint);margin-top:6px;
  }
  .modal-position:empty{display:none;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(8px);
    background:none;border:none;color:var(--ink);
    padding:0;font-size:14px;font-family:var(--font-ui);
    opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;z-index:60;
    display:flex;align-items:center;gap:10px;max-width:94vw;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
  .toast-msg{
    background:var(--surface);border:1px solid var(--line);color:var(--ink);
    padding:11px 16px;border-radius:8px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    display:flex;align-items:center;flex:1;min-width:0;
  }
  .toast-undo{
    background:var(--accent);color:var(--on-accent);font-weight:700;cursor:pointer;
    font-family:var(--font-ui);font-size:13px;white-space:nowrap;flex:none;
    padding:11px 18px;border-radius:8px;
    display:flex;align-items:center;
  }
  .toast-undo:active{opacity:0.75;}

  .sheet-bg{display:none;position:fixed;inset:0;background:var(--scrim);z-index:55;align-items:flex-end;justify-content:center;}
  .sheet-bg.open{display:flex;}
  .sheet{background:var(--surface);border-top:1px solid var(--brass-soft);width:100%;max-width:500px;padding:18px 16px 26px;}
  .sheet h3{font-family:var(--font-name);font-style:var(--name-style);font-weight:500;font-size:16.5px;color:var(--ink-dim);margin:0 0 12px;}
  .sheet-row{
    display:flex;align-items:center;justify-content:space-between;padding:13px 4px;
    border-bottom:1px solid var(--line-soft);cursor:pointer;color:var(--ink);font-size:16px;
  }
  .sheet-row:last-child{border-bottom:none;}
  .sheet-row .dot{width:7px;height:7px;border-radius:50%;background:var(--brass);opacity:0;}
  .sheet-row.selected .dot{opacity:1;}
  .sheet-row.new{color:var(--brass);font-style:var(--name-style);font-family:var(--font-name);}

  .sheet-input{
    width:100%;background:var(--surface-2);border:1px solid var(--line);
    color:var(--ink);font-family:var(--font-ui);font-size:16.5px;
    padding:12px 14px;outline:none;margin-bottom:12px;
  }
  .sheet-input:focus{border-color:var(--brass-soft);box-shadow:0 0 0 3px var(--brass-glow);}
  .sheet-cta{
    width:100%;background:var(--accent);color:var(--on-accent);border:none;
    font-family:var(--font-title);font-weight:600;font-size:16px;
    padding:13px;cursor:pointer;
  }
  .sheet-cta:active{opacity:0.85;}
  .sheet-cta.secondary{
    background:var(--surface-2);color:var(--ink);border:1px solid var(--line);
    margin-top:8px;
  }

  .exit-modal-backdrop{display:none;position:fixed;inset:0;background:var(--scrim);z-index:90;align-items:center;justify-content:center;}
  .exit-modal-backdrop.open{display:flex;}
  .exit-modal{width:calc(100% - 48px);max-width:380px;background:var(--surface);border:1px solid var(--brass-soft);border-radius:16px;padding:26px 22px;text-align:center;}
  .exit-modal h2{font-family:var(--font-title);font-weight:600;font-size:21px;color:var(--ink);margin:0 0 8px;}
  .exit-modal .sub{color:var(--ink-dim);font-size:14px;margin-bottom:20px;}
  .exit-actions{display:flex;gap:10px;}
  .exit-btn{flex:1;padding:13px 6px;border-radius:10px;font-size:14.5px;font-weight:600;cursor:pointer;font-family:var(--font-ui);display:flex;align-items:center;justify-content:center;gap:6px;border:none;}
  .exit-btn.stay{background:var(--surface-2);border:1px solid var(--brass-soft);color:var(--brass);}
  .exit-btn.leave{background:var(--danger-soft);border:1px solid var(--danger-line);color:var(--danger);}
  .exit-btn .ic{font-size:32px;line-height:1;}

  .sort-seg{display:flex;gap:6px;flex:none;}
  .sort-btn{font-family:var(--font-num);font-size:11px;letter-spacing:1px;text-transform:uppercase;background:none;border:1px solid var(--line);color:var(--ink-dim);padding:7px 11px;cursor:pointer;}
  .sort-btn.active{border-color:var(--brass);color:var(--brass);}
  @media (prefers-reduced-motion: reduce){*{transition:none !important;}}
/* ---------- podešavanja: ceo ekran sa pločicama (isto kao u Troškovima) ---------- */
.set-screen{ display:none; position:fixed; inset:0; z-index:70; background:var(--bg); overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 0 calc(24px + env(safe-area-inset-bottom)); box-sizing:border-box; }
.set-screen.open{ display:block; }
.set-header{ position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:4px; padding:calc(10px + env(safe-area-inset-top)) 12px 10px 6px; background:var(--bg); border-bottom:1px solid var(--line); }
.set-back{ width:44px; height:44px; border:none; background:none; color:var(--ink-dim); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; flex:none; border-radius:12px; }
.set-back:active{ background:var(--surface); }
.set-title{ margin:0; padding:0; flex:1; min-width:0; font-family:var(--font-ui); font-size:20px; font-weight:700; color:var(--title-color); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.set-body{ padding:16px 14px; max-width:560px; margin:0 auto; box-sizing:border-box; }
.set-tile{ display:flex; align-items:center; gap:14px; width:100%; padding:18px 16px; margin:0 0 12px; background:var(--surface); border:1px solid var(--line); border-radius:16px; cursor:pointer; text-align:left; font-family:inherit; color:var(--ink); box-sizing:border-box; }
.set-tile:active{ background:var(--surface-2); }
.set-tile .tile-icon{ font-size:26px; flex:none; width:36px; text-align:center; line-height:1; }
.set-tile .tile-text{ flex:1; min-width:0; }
.set-tile .tile-title{ display:block; font-size:16px; font-weight:700; color:var(--ink); }
.set-tile .tile-sub{ display:block; font-size:12px; color:var(--ink-dim); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.set-tile .tile-chev{ color:var(--ink-dim); font-size:22px; flex:none; line-height:1; }
.set-tile.danger{ margin-top:24px; }
.set-tile.danger .tile-title{ color:var(--danger); }
.settings-card{ background:var(--surface); border-radius:13px; border:1px solid var(--line); overflow:hidden; }
.settings-field{ padding:12px 14px; border-bottom:1px solid var(--line); }
.settings-field:last-child{ border-bottom:none; }
.settings-field label{ font-size:11.5px; color:var(--ink-dim); display:block; margin-bottom:5px; }
.settings-field input{ width:100%; min-width:0; border:none; background:transparent; padding:0; font-size:15px; color:var(--ink); font-family:inherit; font-weight:600; outline:none; }
.settings-row{ display:flex; align-items:center; gap:10px; padding:14px; border-bottom:1px solid var(--line); cursor:pointer; background:none; border-left:none; border-right:none; border-top:none; width:100%; text-align:left; font-family:inherit; }
.settings-row:last-child{ border-bottom:none; }
.settings-row:active{ background:var(--surface-2); }
.settings-row .row-icon{ font-size:16px; flex:none; width:20px; text-align:center; }
.settings-row .row-label{ flex:1; font-size:14px; font-weight:600; color:var(--ink); }
.settings-row .chevron{ color:var(--ink-dim); font-size:13px; flex:none; }
.settings-hint{ font-size:11px; color:var(--ink-dim); padding:8px 4px 0; line-height:1.5; }
.set-build{ text-align:center; padding-top:18px; }
/* izbor teme */
.theme-opt{ display:flex; align-items:center; gap:14px; width:100%; padding:12px; margin:0 0 10px; background:var(--surface); border:1.5px solid var(--line); border-radius:16px; cursor:pointer; text-align:left; font-family:inherit; color:var(--ink); box-sizing:border-box; }
.theme-opt.on{ border-color:var(--brass); box-shadow:0 0 0 3px color-mix(in srgb, var(--brass) 22%, transparent); }
.theme-opt .sw{ width:74px; height:48px; border-radius:10px; flex:none; position:relative; overflow:hidden; box-shadow:inset 0 0 0 1px rgba(0,0,0,.08); }
.theme-opt .sw i{ position:absolute; left:7px; right:7px; bottom:7px; height:15px; border-radius:5px; }
.theme-opt .sw b{ position:absolute; right:10px; top:8px; font:700 11px Georgia,serif; }
.theme-opt .t-name{ flex:1; font-size:15.5px; font-weight:700; }
.theme-opt .t-check{ width:24px; height:24px; border-radius:50%; border:1.5px solid var(--line); flex:none; display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--on-brass); }
.theme-opt.on .t-check{ background:var(--brass); border-color:var(--brass); }
[data-theme="ponoc"] .set-tile, [data-theme="ponoc"] .theme-opt{ background:var(--card-shine), var(--surface); }
/* =========================================================
   TEME (vrednosti preuzete iz aplikacije Troškovi)
   Klasična = :root iznad (dosadašnji izgled Arhive)
   ========================================================= */
html[data-theme="banka"]{
  color-scheme:light;
  --bg:#F6F5F1; --surface:#FFFFFF; --surface-2:#EEEBE3; --line:#E6E1D6; --line-soft:#F0ECE3;
  --ink:#18202E; --ink-dim:#7A7F89; --ink-faint:#7A7F89;

/* ---------- Back-button (history) support ---------- */
let backStack = [];
let pendingAfterClose = null;
function pushBack(closer){
  history.pushState({app:true, depth: backStack.length+1}, '');
  backStack.push(closer);
}
function requestClose(){
  if(backStack.length > 0){ history.back(); }
}
function requestCloseThen(fn){
  pendingAfterClose = fn;
  requestClose();
}
window.addEventListener('popstate', ()=>{
  if(backStack.length > 0){
    const fn = backStack.pop();
    fn();
    if(pendingAfterClose){
      const next = pendingAfterClose;
      pendingAfterClose = null;
      next();
    }
    return;
  }
  if(exitConfirmed){ return; }
  exitTrapArmed = false;
  showExitConfirm();
});

/* ---------- Potvrda izlaska iz aplikacije ---------- */
let exitTrapArmed = false;
let exitConfirmed = false;
function armExitTrap(){
  if(!exitTrapArmed){
    try{ history.pushState({exitTrap:true}, '', location.href); }catch(e){}
    exitTrapArmed = true;
  }
}
document.addEventListener('pointerdown', function onceP(){
  armExitTrap();
  document.removeEventListener('pointerdown', onceP);

document.addEventListener('keydown', function onceK(){

function showExitConfirm(){ document.getElementById('exitBackdrop').classList.add('open'); }

document.getElementById('exitLeaveBtn').addEventListener('click', () => {

function pad(n){ return String(n).padStart(3,'0'); }
function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function normalizeSr(s){
  return s.toLowerCase()
    .replace(/š/g,'s').replace(/č/g,'c').replace(/ć/g,'c')
    .replace(/ž/g,'z').replace(/đ/g,'d');
}
function matchItemQuery(item, q){

  return false;

/* ---------- Izvlačenje teksta iz dokumenata (za detaljnu pretragu) ---------- */
function base64ToUint8Array(dataUrl){
  const base64 = dataUrl.split(',')[1];
  const raw = atob(base64);
  const bytes = new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++){ bytes[i] = raw.charCodeAt(i); }
  return bytes;
}
async function extractContentForItem(item){
  try{
    if(item.type === 'pdf'){
      if(typeof pdfjsLib === 'undefined') return null;
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const bytes = base64ToUint8Array(item.dataUrl);
      const pdf = await pdfjsLib.getDocument({data: bytes}).promise;
      let text = '';
      const maxPages = Math.min(pdf.numPages, 15);
      for(let p=1;p<=maxPages;p++){
        const page = await pdf.getPage(p);
        const tc = await page.getTextContent();
        text += tc.items.map(t=>t.str).join(' ') + ' ';
      }
      return text.slice(0, 20000);
    }else if(item.type === 'doc'){
      const ext = (item.ext || '').toLowerCase();
      if(ext === 'docx' && typeof mammoth !== 'undefined'){
        const bytes = base64ToUint8Array(item.dataUrl);
        const result = await mammoth.extractRawText({arrayBuffer: bytes.buffer});
        return result.value.slice(0, 20000);
      }else if((ext === 'xlsx' || ext === 'xls') && typeof XLSX !== 'undefined'){
        const base64 = item.dataUrl.split(',')[1];
        const wb = XLSX.read(base64, {type:'base64'});
        let text = '';
        wb.SheetNames.forEach(name=>{
          text += XLSX.utils.sheet_to_csv(wb.Sheets[name]) + ' ';
        });
        return text.slice(0, 20000);
      }
    }
  }catch(e){
    console.error('extractContentForItem failed:', e);
  }
  return null;
}
async function backfillContent(){
  const targets = items.filter(i=>(i.type==='pdf' || i.type==='doc') && !i.content);
  if(targets.length === 0) return;
  toastPersist('Priprema detaljne pretrage: 0 / ' + targets.length + '...');
  let done = 0;
  for(const it of targets){
    const content = await extractContentForItem(it);
    if(content){
      it.content = normalizeSr(content);
      idbPut(it).catch(e=>console.error(e));
    }
    done++;
    toastPersist('Priprema detaljne pretrage: ' + done + ' / ' + targets.length + '...');
  }
  toastHide();
  render();
}

const LS_PREFIX = 'galerija:';
try{ albumViewMode = localStorage.getItem(LS_PREFIX+'albumViewMode') || 'grid'; }catch(e){}
/* Sortiranje albuma na pocetnom ekranu: '' = rucni redosled, 'alpha' = abeceda, 'recent' = novije */

/* ---------- IndexedDB sloj za stavke (slike/dokumenti) ---------- */
const IDB_NAME = 'galerijaDB';
const IDB_STORE = 'items';
let _idbPromise = null;
function idbOpen(){
  if(_idbPromise) return _idbPromise;
  _idbPromise = new Promise((resolve, reject)=>{
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=>{
      const db = req.result;
      if(!db.objectStoreNames.contains(IDB_STORE)){
        db.createObjectStore(IDB_STORE, {keyPath:'id'});
      }
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
  return _idbPromise;
}
async function idbPut(item){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(item);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}
async function idbDelete(id){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).delete(id);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}
async function idbGetAll(){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).getAll();
    req.onsuccess = ()=>resolve(req.result || []);
    req.onerror = ()=>reject(req.error);
  });
}
async function migrateLegacyLocalStorageItems(){
  try{
    const raw = localStorage.getItem(LS_PREFIX+'item-ids');
    if(!raw) return;
    const ids = JSON.parse(raw);
    if(!Array.isArray(ids) || ids.length === 0){
      localStorage.removeItem(LS_PREFIX+'item-ids');
      return;
    }
    for(const id of ids){
      const raw2 = localStorage.getItem(LS_PREFIX+'item:'+id);
      if(raw2){
        try{ await idbPut(JSON.parse(raw2)); }catch(e){ console.error(e); }
        localStorage.removeItem(LS_PREFIX+'item:'+id);
      }
    }
    localStorage.removeItem(LS_PREFIX+'item-ids');
  }catch(e){
    console.error(e);
  }
}

async function loadAll(){
  try{
    const rawCats = localStorage.getItem(LS_PREFIX+'categories');
    let parsed = rawCats ? JSON.parse(rawCats) : [];
    categories = parsed.map(c => typeof c === 'string' ? {name:c, pinned:false, cover:null} : c);
    await migrateLegacyLocalStorageItems();
    const loaded = await idbGetAll();
    loaded.sort((a,b)=>a.ts-b.ts);
    items = loaded;
    // Oporavak: vrati svaki album koji postoji na slikama a fali u spisku
    let recovered = 0;
    items.forEach(it=>{
      if(it.category && !categories.some(c=>c.name===it.category)){
        categories.push({name:it.category, pinned:false, cover:null});
        recovered++;
      }
    });
    if(recovered > 0){
      saveCategories();
      toast(recovered === 1 ? 'Vraćen 1 album.' : 'Vraćeno albuma: '+recovered+'.');
    }
  }catch(e){
    console.error(e);
    toast('Greška pri učitavanju.');
    items = [];
  }
  render();
  checkBackupReminder();
}
function saveCategories(){ localStorage.setItem(LS_PREFIX+'categories', JSON.stringify(categories)); }
function maybeAutoCover(folderName, item){
  if(!folderName || !item || item.type !== 'image') return;
  const cat = categories.find(c=>c.name===folderName);
  if(cat && !cat.cover){ cat.cover = item.id; saveCategories(); }
}

function folderIconSvg(){
  return '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h4l2 2.5h8a2 2 0 012 2V17a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path></svg>';
}
function pdfIconSvg(){
  return '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>';
}
function openPdf(item){

}

const INBOX = '__inbox__';

function render(){
  currentGalleryItems = [];
  albumHeaderZone.innerHTML = '';
  if(!currentFolder || selectionMode){ crumb.remove(); }
  if(currentFolder){ crumbName.textContent = currentFolder === INBOX ? 'Sve slike' : currentFolder; }
  selHeader.classList.toggle('show', selectionMode);
  selBar.classList.toggle('show', selectionMode);
  document.body.style.paddingBottom = selectionMode ? '90px' : '70px';
  searchbarWrap.style.display = (selectionMode || !searchOpen) ? 'none' : 'flex';
  toolbarWrap.style.display = 'none';
  document.getElementById('settingsBtn').style.display = selectionMode ? 'none' : 'flex';
  document.getElementById('searchBtn').style.display = selectionMode ? 'none' : 'flex';
  document.getElementById('viewToggleBtn').style.display = 'none';
  if(selectionMode){
    selCount.textContent = selectedIds.size + (selectedIds.size===1 ? ' odabrano' : ' odabrano');
    document.getElementById('btnShortcut').hidden = selectedIds.size !== 1;
  }

  const q = normalizeSr(searchEl.value.trim());

  if(currentFolder){
    let filtered = currentFolder === INBOX ? items.filter(i=>!i.category) : items.filter(i=>i.category === currentFolder);
    if(q) filtered = filtered.filter(i=>matchItemQuery(i, q));
    const totalHere = currentFolder === INBOX ? items.filter(i=>!i.category).length : items.filter(i=>i.category===currentFolder).length;
    crumbCount.textContent = totalHere + (totalHere===1 ? ' stavka' : ' stavki');
    contentArea.innerHTML = '';

    /* Red 1: nazad + ceo naziv albuma (ceo red je dugme za izlaz). Red 2: broj stavki + sortiranje */
    const albumHead = document.createElement('div');
    albumHead.style.cssText = 'display:flex;flex-direction:column;gap:10px;margin-bottom:16px;';
    const nameRow = document.createElement('div');
    nameRow.style.cssText = 'display:flex;align-items:center;gap:10px;';
    nameRow.appendChild(crumb);
    if(!selectionMode){
      const albumAdd = document.createElement('button');
      albumAdd.type = 'button';
      albumAdd.className = 'add-sq album-add';
      albumAdd.title = 'Dodaj u ovaj album';
      albumAdd.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>';
      albumAdd.onclick = ()=>openAddSheet();
      nameRow.appendChild(albumAdd);
    }
    albumHead.appendChild(nameRow);
    const sortRow = document.createElement('div');
    sortRow.style.cssText = 'display:flex;align-items:center;justify-content:space-between;gap:10px;';
    sortRow.appendChild(crumbCount);
    albumHead.appendChild(sortRow);
    const sortBtns = document.createElement('div');
    sortBtns.className = 'sort-seg';
    [['date','Datum'],['alpha','Abeceda']].forEach(([mode,label])=>{
      const btn = document.createElement('button');
      btn.textContent = label;
      const active = sortMode === mode;
      btn.className = 'sort-btn' + (active ? ' active' : '');
      btn.onclick = ()=>{ sortMode = mode; render(); };
      sortBtns.appendChild(btn);
    });
    sortRow.appendChild(sortBtns);
    contentArea.appendChild(albumHead);

    if(filtered.length === 0){
      const msg = q ? 'Nema rezultata za "'+escapeHtml(searchEl.value)+'".' : 'Ovaj album je prazan. Dodaj nešto dugmetom iznad.';
      const emptyDiv = document.createElement('div');
      emptyDiv.className = 'empty';
      emptyDiv.innerHTML = '<b>'+(q?'Nema rezultata':'Album je prazan')+'</b><span>'+msg+'</span>';
      contentArea.appendChild(emptyDiv);
      currentGalleryItems = [];
      return;
    }
    if(sortMode === 'alpha'){
      const sorted = filtered.slice().sort((a,b)=>normalizeSr(a.name).localeCompare(normalizeSr(b.name)));
      currentGalleryItems = sorted.filter(i=>i.type==='image');
      const grid = document.createElement('div');
      grid.className = 'grid photos-grid';
      sorted.forEach((item,i)=>grid.appendChild(buildCard(item, i+1)));
      contentArea.appendChild(grid);
    }else{
      currentGalleryItems = filtered.slice().sort((a,b)=>b.ts-a.ts).filter(i=>i.type==='image');
      contentArea.appendChild(buildDatedPhotoSections(filtered));
    }
    return;
  }

  countEl.innerHTML = '<b>' + items.length + '</b> ukupno';
  contentArea.innerHTML = '';

  const closeAlbumViewTop = ()=>{ currentFolder = null; searchEl.value=''; render(); };

  if(q){
    const matchedCats = categories.filter(c=>normalizeSr(c.name).includes(q));
    const inboxMatches = normalizeSr('Sve slike').includes(q);
    const matchedItems = items.filter(i=>matchItemQuery(i, q));

    if(!inboxMatches && matchedCats.length === 0 && matchedItems.length === 0){
      contentArea.innerHTML = '<div class="empty"><b>Nema rezultata</b><span>Nema rezultata za "'+escapeHtml(searchEl.value)+'".</span></div>';
      return;
    }

    if(inboxMatches || matchedCats.length > 0){
      const label = document.createElement('p');
      label.className = 'section-label';
      label.textContent = 'Albumi';
      contentArea.appendChild(label);
      if(inboxMatches){
        const inboxCount = items.filter(i=>!i.category).length;
        const inboxTile = document.createElement('div');
        inboxTile.className = 'folder-tile-wide';
        inboxTile.innerHTML = '<div class="fw-icon">'+folderIconSvg()+'</div><div class="fw-text"><span class="fw-name">Sve slike</span><span class="fw-count">'+inboxCount+' '+(inboxCount===1?'stavka':'stavki')+'</span></div>';
        inboxTile.onclick = ()=>{ currentFolder = INBOX; searchEl.value=''; pushBack(closeAlbumViewTop); render(); };
        contentArea.appendChild(inboxTile);
      }
      if(matchedCats.length > 0){
        const fgrid = document.createElement('div');
        fgrid.className = 'grid folders-grid';
        matchedCats.forEach(cat=>{
          const name = cat.name;
          const count = items.filter(i=>i.category===name).length;
          const tile = document.createElement('div');
          const coverItem = cat.cover ? items.find(i=>i.id===cat.cover) : null;
          tile.className = 'folder-tile';
          if(coverItem){
            tile.innerHTML = '<div class="ftile-cover"><img src="'+coverItem.dataUrl+'"></div><span class="fname">'+escapeHtml(name)+'</span><span class="fcount">'+count+' '+(count===1?'stavka':'stavki')+'</span>';
          }else{
            tile.innerHTML = '<div class="ftile-cover">'+folderIconSvg()+'</div><span class="fname">'+escapeHtml(name)+'</span><span class="fcount">'+count+' '+(count===1?'stavka':'stavki')+'</span>';
          }
          tile.onclick = ()=>{ currentFolder = name; searchEl.value=''; pushBack(closeAlbumViewTop); render(); };
          fgrid.appendChild(tile);
        });
        contentArea.appendChild(fgrid);
      }
    }

    if(matchedItems.length > 0){
      const label2 = document.createElement('p');
      label2.className = 'section-label';
      label2.textContent = 'Slike i dokumenti';
      contentArea.appendChild(label2);
      currentGalleryItems = matchedItems.slice().sort((a,b)=>b.ts-a.ts).filter(i=>i.type==='image');
      contentArea.appendChild(buildDatedPhotoSections(matchedItems));
    }
    return;
  }

  const closeAlbumView = ()=>{ currentFolder = null; searchEl.value=''; render(); };

  const inboxRow = document.createElement('div');
  inboxRow.className = 'inbox-row';

  const inboxCount = items.filter(i=>!i.category).length;
  const inboxTile = document.createElement('div');
  inboxTile.className = 'folder-tile-wide';
  inboxTile.innerHTML = '<div class="fw-icon">'+folderIconSvg()+'</div><div class="fw-text"><span class="fw-name">Sve slike</span><span class="fw-count">'+inboxCount+' '+(inboxCount===1?'stavka':'stavki')+'</span></div>';
  inboxTile.onclick = ()=>{ currentFolder = INBOX; searchEl.value=''; pushBack(closeAlbumView); render(); };
  const inboxAdd = document.createElement('button');
  inboxAdd.type = 'button';
  inboxAdd.className = 'add-sq';
  inboxAdd.title = 'Dodaj';
  inboxAdd.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>';
  inboxAdd.onclick = (e)=>{ e.stopPropagation(); openAddSheet(); };
  inboxTile.appendChild(inboxAdd);
  inboxRow.appendChild(inboxTile);

  const label = document.createElement('p');
  label.className = 'album-summary';
  label.innerHTML = 'Svi albumi <span class="count-part">&middot; ' + items.length + ' stavki</span>';
  const summaryRow = document.createElement('div');
  summaryRow.style.cssText = 'display:flex;align-items:center;justify-content:space-between;gap:10px;';
  summaryRow.appendChild(label);
  inboxRow.appendChild(summaryRow);

  /* ABECEDA / NOVIJE: dodir ukljucuje, ponovni dodir iskljucuje (povratak na rucni redosled) */
  const albumSortBtns = document.createElement('div');
  albumSortBtns.className = 'sort-seg';
  [['alpha','Abeceda'],['recent','Datum']].forEach(([mode,lbl])=>{
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = lbl;
    const active = albumSort === mode;
    btn.className = 'sort-btn' + (active ? ' active' : '');
    btn.onclick = ()=>{
      albumSort = albumSort === mode ? '' : mode;
      try{ localStorage.setItem(LS_PREFIX+'albumSort', albumSort); }catch(e){}
      render();
    };
    albumSortBtns.appendChild(btn);
  });
  summaryRow.appendChild(albumSortBtns);

  albumHeaderZone.appendChild(inboxRow);
  /* Kvadrat: sirina = unutrasnja visina plocice */
  inboxAdd.style.width = inboxTile.clientHeight + 'px';

  const pinnedCats = categories.filter(c=>c.pinned);
  const otherCats = categories.filter(c=>!c.pinned);

  /* Prikazni redosled; rucni redosled u categories ostaje netaknut */
  const lastTsByCat = {};
  items.forEach(i=>{ if(i.category && (lastTsByCat[i.category]||0) < i.ts) lastTsByCat[i.category] = i.ts; });
  const displayOrder = (arr)=>{
    if(albumSort === 'alpha') return arr.slice().sort((a,b)=>normalizeSr(a.name).localeCompare(normalizeSr(b.name)));
    if(albumSort === 'recent') return arr.slice().sort((a,b)=>(lastTsByCat[b.name]||0)-(lastTsByCat[a.name]||0));
    return arr;
  };

  function commitGroupOrder(groupCats, container){
    const orderedNames = Array.from(container.children)
      .map(el=>el.dataset && el.dataset.catName)
      .filter(Boolean);
    const newGroupCats = orderedNames.map(n=>groupCats.find(c=>c.name===n)).filter(Boolean);
    if(newGroupCats.length !== groupCats.length) return;
    let gi = 0;
    categories = categories.map(c=> groupCats.includes(c) ? newGroupCats[gi++] : c);
    saveCategories();
  }

  const buildFolderTile = (cat, groupCats)=>{
    const name = cat.name;
    const count = items.filter(i=>i.category===name).length;
    const tile = document.createElement('div');
    tile.dataset.catName = name;
    const coverItem = cat.cover ? items.find(i=>i.id===cat.cover) : null;
    const isList = albumViewMode === 'list';
    tile.className = isList ? 'folder-tile-row' : 'folder-tile';
    const coverInner = coverItem ? '<img src="'+coverItem.dataUrl+'">' : folderIconSvg();
    if(isList){
      tile.innerHTML = '<div class="ftile-cover">'+coverInner+'</div><div class="fr-text"><span class="fname">'+escapeHtml(name)+'</span><span class="fcount">'+count+' '+(count===1?'stavka':'stavki')+'</span></div>';
    }else{
      tile.innerHTML = '<div class="ftile-cover">'+coverInner+'</div><span class="fname">'+escapeHtml(name)+'</span><span class="fcount">'+count+' '+(count===1?'stavka':'stavki')+'</span>';
    }
    if(cat.pinned){
      const pin = document.createElement('div');
      pin.className = 'pin-mark';
      pin.textContent = 'P';
      tile.querySelector('.ftile-cover').appendChild(pin);
    }

    const handle = document.createElement('div');
    handle.className = 'drag-handle';
    handle.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><circle cx="8" cy="6" r="1.6"></circle><circle cx="16" cy="6" r="1.6"></circle><circle cx="8" cy="12" r="1.6"></circle><circle cx="16" cy="12" r="1.6"></circle><circle cx="8" cy="18" r="1.6"></circle><circle cx="16" cy="18" r="1.6"></circle></svg>';
    if(!albumSort) tile.appendChild(handle);

    /* Dugi pritisak bilo gde na plocici (osim rucke) -> meni */
    let pressTimer = null;
    let menuArmed = false;
    let mStartX = 0, mStartY = 0;
    const cancelMenuTimer = ()=>{ if(pressTimer){ clearTimeout(pressTimer); pressTimer = null; } };
    tile.addEventListener('pointerdown', (e)=>{
      if(e.target.closest('.drag-handle')) return;
      if(e.button !== undefined && e.button !== 0) return;
      mStartX = e.clientX; mStartY = e.clientY;
      menuArmed = false;
      pressTimer = setTimeout(()=>{
        menuArmed = true;
        if(navigator.vibrate){ try{ navigator.vibrate(15); }catch(err){} }
        openAlbumContext(name);
      }, 480);
    });
    tile.addEventListener('pointermove', (e)=>{
      if(pressTimer){
        const dx = e.clientX - mStartX, dy = e.clientY - mStartY;
        if(Math.sqrt(dx*dx + dy*dy) > 12){ cancelMenuTimer(); }
      }
    });
    tile.addEventListener('pointerup', ()=>{
      cancelMenuTimer();
      if(menuArmed){ tile.dataset.suppressClick = '1'; menuArmed = false; }
    });
    tile.addEventListener('pointercancel', ()=>{ cancelMenuTimer(); menuArmed = false; });

    /* Prevlačenje samo preko rucke */
    let dragging = false;
    let startX = 0, startY = 0, startRect = null, placeholder = null;

    const beginDrag = ()=>{
      dragging = true;
      tile.classList.add('tile-dragging');
      startRect = tile.getBoundingClientRect();
      tile.style.position = 'fixed';
      tile.style.left = startRect.left + 'px';
      tile.style.top = startRect.top + 'px';
      tile.style.width = startRect.width + 'px';
      tile.style.height = startRect.height + 'px';
      tile.style.zIndex = '200';
      tile.style.pointerEvents = 'none';
      placeholder = document.createElement('div');
      placeholder.className = tile.className.replace('tile-dragging','') + ' drag-placeholder';
      placeholder.style.width = startRect.width + 'px';
      placeholder.style.height = startRect.height + 'px';
      tile.parentNode.insertBefore(placeholder, tile.nextSibling);
      if(navigator.vibrate){ try{ navigator.vibrate(15); }catch(err){} }
    };

    handle.addEventListener('pointerdown', (e)=>{
      if(e.button !== undefined && e.button !== 0) return;
      e.stopPropagation();
      startX = e.clientX; startY = e.clientY;
      try{ handle.setPointerCapture(e.pointerId); }catch(err){}
      beginDrag();
    });
    handle.addEventListener('pointermove', (e)=>{
      if(!dragging) return;
      e.stopPropagation();
      if(e.cancelable) e.preventDefault();
      const dx = e.clientX - startX, dy = e.clientY - startY;
      tile.style.left = (startRect.left + dx) + 'px';
      tile.style.top = (startRect.top + dy) + 'px';
      const under = document.elementFromPoint(e.clientX, e.clientY);
      const overTile = under && under.closest('.folder-tile, .folder-tile-row');
      if(overTile && overTile !== tile && overTile !== placeholder && overTile.parentNode === placeholder.parentNode){
        const overRect = overTile.getBoundingClientRect();
        const isGrid = !isList;
        const before = isGrid
          ? (e.clientY < overRect.top + overRect.height/2) || (e.clientY < overRect.bottom && e.clientX < overRect.left + overRect.width/2)
          : (e.clientY < overRect.top + overRect.height/2);
        overTile.parentNode.insertBefore(placeholder, before ? overTile : overTile.nextSibling);
      }
    });
    const endDrag = (e)=>{
      if(!dragging) return;
      e.stopPropagation();
      try{ if(e && e.pointerId !== undefined) handle.releasePointerCapture(e.pointerId); }catch(err){}
      dragging = false;
      tile.classList.remove('tile-dragging');
      tile.style.position = '';
      tile.style.left = '';
      tile.style.top = '';
      tile.style.width = '';
      tile.style.height = '';
      tile.style.zIndex = '';
      tile.style.pointerEvents = '';
      if(placeholder && placeholder.parentNode){
        placeholder.parentNode.insertBefore(tile, placeholder);
        const container = placeholder.parentNode;
        placeholder.remove();
        placeholder = null;
        commitGroupOrder(groupCats, container);
      }
    };
    handle.addEventListener('pointerup', endDrag);
    handle.addEventListener('pointercancel', endDrag);
    handle.onclick = (e)=>{ e.stopPropagation(); };

    tile.onclick = (e)=>{
      if(tile.dataset.suppressClick === '1'){ tile.dataset.suppressClick = ''; return; }
      currentFolder = name; searchEl.value=''; pushBack(closeAlbumView); render();
    };
    return tile;
  };

  const setupViewToggleBtn = ()=>{
    const btn = document.getElementById('viewToggleBtn');
    btn.title = albumViewMode === 'grid' ? 'Prikaži kao listu' : 'Prikaži kao mrežu';
    btn.innerHTML = albumViewMode === 'grid'
      ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>'
      : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect></svg>';
    btn.onclick = ()=>{
      albumViewMode = albumViewMode === 'grid' ? 'list' : 'grid';
      try{ localStorage.setItem(LS_PREFIX+'albumViewMode', albumViewMode); }catch(e){}
      render();
    };
    btn.style.display = selectionMode ? 'none' : 'flex';
  };
  setupViewToggleBtn();

  const gridClass = 'grid folders-grid' + (albumViewMode === 'list' ? ' folders-list' : '');

  if(pinnedCats.length > 0){
    const pinGrid = document.createElement('div');
    pinGrid.className = gridClass;
    displayOrder(pinnedCats).forEach(cat=>pinGrid.appendChild(buildFolderTile(cat, pinnedCats)));
    contentArea.appendChild(pinGrid);
  }

  const fgrid = document.createElement('div');
  fgrid.className = gridClass;
  displayOrder(otherCats).forEach(cat=>fgrid.appendChild(buildFolderTile(cat, otherCats)));
  contentArea.appendChild(fgrid);
}

  document.getElementById('acPin').querySelector('span').textContent = cat && cat.pinned ? 'Otkači sa vrha' : 'Zakači na vrh';

}

document.getElementById('acCover').onclick = ()=>{

document.getElementById('acDelete').onclick = ()=>{
  const name = albumContextTarget;
  requestClose();

  const catIndex = categories.indexOf(cat);
  const affectedItems = items.filter(it=>it.category===name);
  affectedItems.forEach(it=>{ it.category = null; });
  categories = categories.filter(c=>c.name!==name);
  saveCategories();
  if(currentFolder === name) currentFolder = null;
  render();
  toastUndo(
    'Album "'+name+'" obrisan.',
    ()=>{
      categories.splice(catIndex, 0, cat);
      affectedItems.forEach(it=>{ it.category = name; });
      saveCategories();
      render();
    },
    ()=>{
      affectedItems.forEach(it=>{ idbPut(it).catch(e=>console.error(e)); });
    }
  );
};

const closeCoverPicker = ()=>document.getElementById('coverPickerSheet').classList.remove('open');
document.getElementById('coverPickerBack').onclick = ()=>requestClose();

const MESECI = ['januar','februar','mart','april','maj','jun','jul','avgust','septembar','oktobar','novembar','decembar'];
function formatDateLabel(ts){
  const d = new Date(ts);
  const now = new Date();
  const sameDay = (a,b)=> a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  const yesterday = new Date(now); yesterday.setDate(now.getDate()-1);
  if(sameDay(d, now)) return 'Danas';
  if(sameDay(d, yesterday)) return 'Juče';
  const suffix = d.getFullYear() !== now.getFullYear() ? ' ' + d.getFullYear() + '.' : '';
  return d.getDate() + '. ' + MESECI[d.getMonth()] + suffix;
}

function buildCard(item, indexNumber){
  const card = document.createElement('div');
  card.className = 'card' + (selectionMode ? ' selectable' : '') + (selectedIds.has(item.id) ? ' selected' : '');

  const thumbBox = document.createElement('div');
  const isPdf = item.type === 'pdf';
  const isDoc = item.type === 'doc';
  thumbBox.className = 'thumb-box' + ((isPdf || isDoc) ? ' pdf-thumb' : '');
  const corner = document.createElement('div');
  corner.className = 'corner';
  if(isPdf || isDoc){
    thumbBox.innerHTML = pdfIconSvg() + '<span class="pdf-label">'+(isPdf ? 'PDF' : (item.ext || 'FAJL'))+'</span>';
    thumbBox.appendChild(corner);
  }else{
    const img = document.createElement('img');
    img.src = item.dataUrl;

function buildDatedPhotoSections(list){
  const frag = document.createDocumentFragment();
  const sorted = list.slice().sort((a,b)=>b.ts-a.ts);
  let lastKey = null;
  let currentGrid = null;
  let idx = 0;
  sorted.forEach(item=>{
    const d = new Date(item.ts);
    const key = d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();
    if(key !== lastKey){
      lastKey = key;
      const label = document.createElement('p');
      label.className = 'date-label';
      label.textContent = formatDateLabel(item.ts);
      frag.appendChild(label);
      currentGrid = document.createElement('div');
      currentGrid.className = 'grid photos-grid';
      frag.appendChild(currentGrid);
    }
    idx++;
    currentGrid.appendChild(buildCard(item, idx));
  });
  return frag;
}

let _undoTimer = null;
let _undoFinalize = null;
function toastUndo(msg, undoFn, finalizeFn){
  if(_undoTimer){ clearTimeout(_undoTimer); _undoTimer = null; }
  if(_undoFinalize){ const prev = _undoFinalize; _undoFinalize = null; prev(); }
  toastEl.innerHTML = '<span class="toast-msg">'+escapeHtml(msg)+'</span><span class="toast-undo" id="toastUndoBtn">Opozovi</span>';
  toastEl.classList.add('show');
  let done = false;
  const finalizeOnce = ()=>{
    if(done) return;
    done = true;
    _undoFinalize = null;
    finalizeFn();
  };
  _undoFinalize = finalizeOnce;
  document.getElementById('toastUndoBtn').onclick = ()=>{
    if(done) return;
    done = true;
    _undoFinalize = null;
    clearTimeout(_undoTimer); _undoTimer = null;
    toastEl.classList.remove('show');
    undoFn();
  };
  _undoTimer = setTimeout(()=>{
    _undoTimer = null;
    toastEl.classList.remove('show');
    finalizeOnce();
  }, 5000);
}

  if(document.visibilityState === 'hidden' && _undoFinalize){

async function addFilesWithProgress(files, category){
  if(files.length === 0) return;
  if(files.length === 1){ await addFile(files[0], category); return; }
  const total = files.length;
  let completed = 0;
  _diag = { worker: 0, fallback: 0, errors: [] };
  const t0 = performance.now();
  toastPersist('Obrađujem 0 / ' + total + '...');
  const CONCURRENCY = 3;
  let nextIndex = 0;
  const lane = async ()=>{
    while(nextIndex < files.length){
      const idx = nextIndex++;
      await addFile(files[idx], category);
      completed++;
      toastPersist('Obrađujem ' + completed + ' / ' + total + '...');
    }
  };
  const lanes = [];
  for(let i=0;i<Math.min(CONCURRENCY, files.length);i++){ lanes.push(lane()); }
  await Promise.all(lanes);
  const secs = ((performance.now() - t0) / 1000).toFixed(1);
  toastHide();
  toast(total===1 ? 'Dodato 1 stavka.' : 'Dodato ' + total + ' stavki.');
  console.log('Arhiva: obrada '+total+' fajlova za '+secs+'s (brzo:'+_diag.worker+' sporo:'+_diag.fallback+')', _diag.errors);
}

/* ---------- Kompresija slike u pozadinskim nitima (Web Worker pool), da ne blokira UI i da ide paralelno ---------- */
const COMPRESS_POOL_SIZE = 3;
let _compressWorkers = [];
let _compressWorkerBroken = false;
let _compressReqId = 0;
const _compressPending = new Map();
let _compressNextWorker = 0;

const COMPRESS_WORKER_CODE = [
  "self.onmessage = async (e)=>{",
  "  const { id, buffer, mime, maxDim, quality } = e.data;",
  "  try{",
  "    const blob = new Blob([buffer], {type: mime || 'image/jpeg'});",
  "    const bitmap = await createImageBitmap(blob);",
  "    let w = bitmap.width, h = bitmap.height;",
  "    if(w > maxDim || h > maxDim){",
  "      if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }",
  "      else{ w = Math.round(w * maxDim / h); h = maxDim; }",
  "    }",
  "    const canvas = new OffscreenCanvas(w, h);",
  "    const ctx = canvas.getContext('2d');",
  "    ctx.drawImage(bitmap, 0, 0, w, h);",
  "    bitmap.close();",
  "    const outBlob = await canvas.convertToBlob({type:'image/jpeg', quality});",
  "    const outBuffer = await outBlob.arrayBuffer();",
  "    self.postMessage({id, buffer: outBuffer}, [outBuffer]);",
  "  }catch(err){",
  "    self.postMessage({id, error: String(err && err.message || err)});",
  "  }",
  "};"
].join('\n');

function getCompressWorker(){
  if(_compressWorkerBroken) return null;
  if(typeof Worker === 'undefined' || typeof OffscreenCanvas === 'undefined' || typeof createImageBitmap === 'undefined'){
    _compressWorkerBroken = true;
    return null;
  }
  if(_compressWorkers.length < COMPRESS_POOL_SIZE){
    try{
      const blob = new Blob([COMPRESS_WORKER_CODE], {type:'application/javascript'});
      const worker = new Worker(URL.createObjectURL(blob));
      worker.onmessage = (e)=>{
        const { id, buffer, error } = e.data;
        const p = _compressPending.get(id);
        if(!p) return;
        _compressPending.delete(id);
        if(error){ p.reject(new Error(error)); }
        else{ p.resolve(buffer); }
      };
      worker.onerror = ()=>{ _compressWorkerBroken = true; _compressWorkers = []; };
      _compressWorkers.push(worker);
    }catch(e){
      _compressWorkerBroken = true;
      return null;
    }
  }
  if(_compressWorkers.length === 0) return null;
  const w = _compressWorkers[_compressNextWorker % _compressWorkers.length];
  _compressNextWorker++;
  return w;
}

function bufferToDataUrl(buffer, mime){
  return new Promise((resolve)=>{
    const blob = new Blob([buffer], {type: mime});
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = ()=>resolve(null);
    reader.readAsDataURL(blob);
  });
}

async function compressImageViaWorker(file){
  const worker = getCompressWorker();
  if(!worker) return null;
  const buffer = await file.arrayBuffer();
  const id = ++_compressReqId;
  const resultBuffer = await new Promise((resolve, reject)=>{
    _compressPending.set(id, {resolve, reject});
    worker.postMessage({id, buffer, mime: file.type, maxDim: 1600, quality: 0.85}, [buffer]);
  });
  return await bufferToDataUrl(resultBuffer, 'image/jpeg');
}

function compressImageMainThread(file){
  return new Promise((resolve, reject)=>{
    const MAX_DIM = 1600;
    const QUALITY = 0.85;
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > MAX_DIM || h > MAX_DIM){
          if(w > h){ h = Math.round(h * MAX_DIM / w); w = MAX_DIM; }
          else{ w = Math.round(w * MAX_DIM / h); h = MAX_DIM; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', QUALITY));
      };
      img.onerror = ()=>resolve(e.target.result); // fallback: use uncompressed if decode fails
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

let _diag = { worker: 0, fallback: 0, errors: [] };
async function compressImage(file){
  try{
    const viaWorker = await compressImageViaWorker(file);
    if(viaWorker){ _diag.worker++; return viaWorker; }
  }catch(e){
    console.error('Compress worker failed, falling back to main thread:', e);
    _diag.errors.push(String(e && e.message || e));
  }
  _diag.fallback++;
  return compressImageMainThread(file);
}
async function addFile(file, category){
  try{
    const sourceSig = file.name + '|' + file.size;
    const dup = items.find(i => i.sourceSig === sourceSig);
    if(dup){
      if(!confirm('Izgleda da "'+dup.name+'" već postoji u arhivi (isti naziv i veličina fajla). Dodati je ipak?')){
        return;
      }
    }
    const isPdf = file.type === 'application/pdf';
    const isImage = file.type.startsWith('image/');
    const isDoc = !isPdf && !isImage;
    const dataUrl = isImage ? await compressImage(file) : await readFileAsDataUrl(file);
    const id = 'i' + Date.now() + Math.random().toString(36).slice(2,8);
    const baseName = file.name.replace(/\.[^.]+$/, '');
    const ext = (file.name.match(/\.([^.]+)$/) || [,''])[1].toUpperCase();
    const item = {
      id,
      name: baseName || (isPdf ? 'Dokument' : (isDoc ? 'Dokument' : 'Slika')),
      dataUrl,
      ts: Date.now(),
      category: category || null,
      type: isPdf ? 'pdf' : (isDoc ? 'doc' : 'image'),
      ext: isDoc ? ext : undefined,
      sourceSig
    };
    await idbPut(item);
    items.push(item);
    maybeAutoCover(category, item);
    render();
    if(item.type === 'pdf' || item.type === 'doc'){
      extractContentForItem(item).then(content=>{
        if(content){
          item.content = normalizeSr(content);
          idbPut(item).catch(e=>console.error(e));
        }
      });
    }
  }catch(e){
    console.error(e);
    if(e && (e.name === 'QuotaExceededError' || (e.target && e.target.error && e.target.error.name === 'QuotaExceededError'))){ toast('Nema više prostora za nove stavke u browseru.'); }
    else{ toast('Greška pri dodavanju.'); }
  }
}

/* ---------- BACKUP REMINDER ---------- */
function getBackupIntervalDays(){
  const v = parseInt(localStorage.getItem(LS_PREFIX+'backupIntervalDays'));
  return (v && v > 0) ? v : 7;
}
function setBackupIntervalDays(days){ localStorage.setItem(LS_PREFIX+'backupIntervalDays', String(days)); }
function getLastBackupDate(){
  const v = localStorage.getItem(LS_PREFIX+'lastBackup');
  return v ? new Date(v) : null;
}
function markBackupDone(){ localStorage.setItem(LS_PREFIX+'lastBackup', new Date().toISOString()); checkBackupReminder(); }
function daysSinceBackup(date){ return Math.floor((Date.now() - date.getTime()) / 86400000); }
function lastBackupShort(){
  const last = getLastBackupDate();
  if(!last) return 'nikad';
  return String(last.getDate()).padStart(2,'0')+'.'+String(last.getMonth()+1).padStart(2,'0')+'.'+last.getFullYear();
}
function lastBackupDisplay(){ return 'poslednja rezervna kopija: ' + lastBackupShort(); }
function checkBackupReminder(){
  const row = document.getElementById('backupReminderRow');
  const textEl = document.getElementById('backupReminderText');
  if(!row || !textEl) return;
  const last = getLastBackupDate();
  const interval = getBackupIntervalDays();
  let msg = null;
  if(!last){
    msg = 'Nikad nisi napravio bekap podataka.';
  } else {
    const d = daysSinceBackup(last);
    if(d >= interval) msg = 'Prošlo je '+d+' dana od poslednjeg bekapa.';
  }
  if(msg){ textEl.textContent = msg; row.style.display = 'flex'; }
  else { row.style.display = 'none'; }
}
document.getElementById('backupReminderBtn').addEventListener('click', exportBackup);
function saveBackupInterval(v){
  setBackupIntervalDays(parseInt(v) || 7);
  checkBackupReminder();
}

/* ---------- TEME (iste kao u aplikaciji Troškovi) ---------- */
const THEMES = [
  {id:'banka',    name:'Privatno bankarstvo', bar:'#0E2747', bg:'#F6F5F1', card:'linear-gradient(140deg,#16365F,#0A1C34)', num:'#D9B46A'},
  {id:'crna',     name:'Crna kartica',        bar:'#1B1B1E', bg:'#1B1B1E', card:'linear-gradient(150deg,#34343A,#111113)', num:'#CDB27A'},
  {id:'ponoc',    name:'Ponoć',               bar:'#000000', bg:'#000000', card:'#1E2024', num:'#6FC48A'},
  {id:'koza',     name:'Kožni rokovnik',      bar:'#1F3A2E', bg:'#EFE8D8', card:'#1F3A2E', num:'#7A2331'},
  {id:'klasicna', name:'Klasična',            bar:'#0d0e10', bg:'#0d0e10', card:'#1f2124', num:'#c9a355'}
];
function getTheme(){
  let v = null;
  try{ v = localStorage.getItem(LS_PREFIX+'theme'); }catch(e){}
  return (v && THEMES.some(x=>x.id===v)) ? v : 'klasicna';
}
function themeName(id){ return (THEMES.find(x=>x.id===id) || THEMES.find(x=>x.id==='klasicna')).name; }
function applyTheme(id){
  const th = THEMES.find(x=>x.id===id) || THEMES.find(x=>x.id==='klasicna');
  document.documentElement.setAttribute('data-theme', th.id);
  const meta = document.getElementById('themeColor');
  if(meta) meta.setAttribute('content', th.bar);
}
function setTheme(id){
  if(!THEMES.some(x=>x.id===id)) return;
  try{ localStorage.setItem(LS_PREFIX+'theme', id); }catch(e){}
  applyTheme(id);
}
function pickTheme(id){
  setTheme(id);
  const list = document.getElementById('themeOptList');
  if(list) list.innerHTML = themeOptionsHtml();
  render();
}
function themeOptionsHtml(){
  const cur = getTheme();
  return THEMES.map(x=>'<button type="button" class="theme-opt'+(x.id===cur?' on':'')+'" onclick="pickTheme(\''+x.id+'\')">'+
    '<span class="sw" style="background:'+x.bg+'"><i style="background:'+x.card+'"></i><b style="color:'+x.num+'">2.840</b></span>'+
    '<span class="t-name">'+escapeHtml(x.name)+'</span><span class="t-check">'+(x.id===cur?'✓':'')+'</span></button>').join('');
}
applyTheme(getTheme());

/* ---------- Podešavanja: ceo ekran sa pločicama i pod-ekranima (kao u Troškovima) ---------- */
const settingsScreen = document.getElementById('settingsScreen');
const settingsPanel = document.getElementById('settingsPanel');
let settingsSubOpen = false;
const SETTINGS_BACK_SVG = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';
function settingsHeader(title){
  return '<div class="set-header"><button type="button" class="set-back" onclick="requestClose()" aria-label="nazad">'+SETTINGS_BACK_SVG+'</button><h2 class="set-title">'+escapeHtml(title)+'</h2></div>';
}
function settingsTile(icon, title, sub, onclick, extraClass){
  return '<button type="button" class="set-tile'+(extraClass?' '+extraClass:'')+'" onclick="'+onclick+'">'+
    '<span class="tile-icon">'+icon+'</span>'+
    '<span class="tile-text"><span class="tile-title">'+escapeHtml(title)+'</span>'+(sub?'<span class="tile-sub">'+escapeHtml(sub)+'</span>':'')+'</span>'+
    '<span class="tile-chev">›</span></button>';
}
function renderSettingsTiles(){
  settingsPanel.innerHTML = settingsHeader('podešavanja')+
    '<div class="set-body">'+
    settingsTile('🎨', 'tema', themeName(getTheme()), "openSettingsSub('theme')")+
    settingsTile('💾', 'rezervna kopija', lastBackupDisplay(), "openSettingsSub('backup')")+
    settingsTile('🗑', 'obriši sve podatke', 'trajno briše sve slike, dokumente i albume', 'wipeAllData()', 'danger')+
    '<div class="settings-hint" id="storageInfo"></div>'+
    '<div class="settings-hint set-build">build 2026-09-24d</div>'+
    '</div>';
  settingsScreen.scrollTop = 0;
  updateStorageInfo();
}
function openSettings(){
  settingsSubOpen = false;
  renderSettingsTiles();
  settingsScreen.classList.add('open');
  pushBack(closeSettings);
}
const closeSettings = ()=>{ settingsSubOpen = false; settingsScreen.classList.remove('open'); };
function openSettingsSub(which){
  let title = '', body = '';
  if(which === 'theme'){
    title = 'tema';
    body = '<div id="themeOptList">'+themeOptionsHtml()+'</div>'+
      '<div class="settings-hint">promena se vidi odmah. izbor se pamti i čuva u rezervnoj kopiji.</div>';
  }else if(which === 'backup'){
    title = 'rezervna kopija';
    body =
      '<div class="settings-card">'+
      '<button type="button" class="settings-row" onclick="exportBackup()"><span class="row-icon">💾</span><span class="row-label">rezervna kopija - izvezi</span><span class="chevron">›</span></button>'+
      '<button type="button" class="settings-row" onclick="triggerImportBackup()"><span class="row-icon">📂</span><span class="row-label">rezervna kopija - uvezi</span><span class="chevron">›</span></button>'+
      '</div>'+
      '<div class="settings-hint">rezervna kopija čuva sve slike, dokumente i albume odjednom - sačuvaj je povremeno (npr. u Google Drive) da ne izgubiš podatke.</div>'+
      '<div class="settings-card" style="margin-top:14px;">'+
      '<div class="settings-field"><label for="backupIntervalInput">podseti me na svakih (dana)</label><input type="number" inputmode="numeric" min="1" id="backupIntervalInput" value="'+getBackupIntervalDays()+'" oninput="saveBackupInterval(this.value)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></div>'+
      '</div>'+
      '<div class="settings-hint">kad prođe ovoliko dana od poslednje rezervne kopije, gore će se pojaviti podsetnik.</div>'+
      '<div class="settings-hint" id="lastBackupHint">'+lastBackupDisplay()+'</div>';
  }else{ return; }
  settingsPanel.innerHTML = settingsHeader(title)+'<div class="set-body">'+body+'</div>';
  settingsScreen.scrollTop = 0;
  if(!settingsSubOpen){
    settingsSubOpen = true;
    pushBack(settingsBackToTiles);
  }
}
/* povratak sa pod-ekrana na pločice (strelica i dugme "nazad" telefona idu kroz istoriju) */
const settingsBackToTiles = ()=>{ settingsSubOpen = false; renderSettingsTiles(); };
function triggerImportBackup(){ importInput.click(); }
document.getElementById('settingsBtn').onclick = openSettings;

function updateStorageInfo(){
  let bytes = 0;
  items.forEach(it=>{ bytes += (it.dataUrl ? it.dataUrl.length : 0); });
  const mb = bytes / 1024 / 1024;
  const infoEl = document.getElementById('storageInfo');
  if(!infoEl) return;
  infoEl.textContent = 'Iskorišćeno: ~' + mb.toFixed(1) + ' MB \u00B7 ' + items.length + ' stavki';
  if(navigator.storage && navigator.storage.estimate){
    navigator.storage.estimate().then(est=>{
      if(est && est.quota){
        const usedMb = (est.usage || 0) / 1024 / 1024;
        const quotaMb = est.quota / 1024 / 1024;
        const freeMb = Math.max(0, quotaMb - usedMb);
        infoEl.textContent = 'Iskorišćeno: ~' + mb.toFixed(1) + ' MB \u00B7 ' + items.length + ' stavki \u00B7 Slobodno još ~' + freeMb.toFixed(0) + ' MB';
      }
    }).catch(()=>{});
  }
}

function exportBackup(){
  const data = {
    version: 1,
    exportedAt: new Date().toISOString(),
    categories: categories,
    items: items,
    settings: { theme: getTheme() }
  };
  const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = 'arhiva-backup-' + stamp + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  markBackupDone();
  const hintEl = document.getElementById('lastBackupHint');
  if(hintEl) hintEl.textContent = lastBackupDisplay();
  toast('Rezervna kopija sačuvana.');
}

const importInput = document.getElementById('importInput');
async function wipeAllData(){
  if(!confirm('Ovo trajno briše SVE slike, dokumente i albume iz Arhive na ovom uređaju. Nema opoziva. Da li si siguran/na?')) return;
  if(!confirm('Poslednja potvrda — stvarno obrisati baš sve?')) return;
  try{
    for(const it of items.slice()){ await idbDelete(it.id).catch(()=>{}); }
    items = [];
    categories = [];
    saveCategories();
    currentFolder = null;
    render();
    updateStorageInfo();
    toast('Sve je obrisano.');
    requestClose();
  }catch(e){
    console.error(e);
    toast('Greška pri brisanju.');
  }
}
importInput.addEventListener('change', (e)=>{
  const file = e.target.files && e.target.files[0];
  importInput.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (ev)=>{
    try{
      const data = JSON.parse(ev.target.result);
      if(!data || !Array.isArray(data.items)) throw new Error('bad format');
      if(data.settings && data.settings.theme) setTheme(data.settings.theme);
      (data.categories || []).forEach(c=>{
        const catObj = typeof c === 'string' ? {name:c} : c;
        if(catObj && catObj.name && !categories.some(existing=>existing.name === catObj.name)){
          categories.push({name: catObj.name, pinned: !!catObj.pinned, cover: null});
        }
      });
      saveCategories();
      let added = 0;
      for(const it of data.items){
        if(!it || !it.dataUrl) continue;
        const newId = 'i' + Date.now() + Math.random().toString(36).slice(2,8);
        const clone = {
          id: newId,
          name: it.name || 'Stavka',
          dataUrl: it.dataUrl,
          ts: it.ts || Date.now(),
          category: it.category && categories.some(c=>c.name===it.category) ? it.category : null,
          type: it.type === 'pdf' ? 'pdf' : (it.type === 'doc' ? 'doc' : 'image'),
          ext: it.ext
        };
        items.push(clone);
        try{ await idbPut(clone); }catch(err){ console.error(err); }
        added++;
      }
      updateStorageInfo();
      render();
      toast('Uvezeno ' + added + ' stavki.');
    }catch(err){
      console.error(err);
      toast('Fajl nije prepoznat kao rezervna kopija.');
    }
  };
  reader.readAsText(file);
});

function checkDeepLink(){
  const hashMatch = location.hash.match(/^#p=(.+)$/);
  const queryMatch = location.search.match(/[?&]p=([^&]+)/);
  const m = hashMatch || queryMatch;
  if(m){
    const id = decodeURIComponent(m[1]);
    const item = items.find(i=>i.id === id);
    if(item){
      document.title = item.name;
      if(item.type === 'pdf' || item.type === 'doc'){ openPdf(item); }
      else{ openModal(item); }
    }
  }
}
